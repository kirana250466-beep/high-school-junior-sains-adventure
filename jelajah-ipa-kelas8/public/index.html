><td>lapisan peka cahaya tempat bayangan jatuh; punya <strong>sel kerucut</strong> (warna, cahaya terang) dan <strong>sel batang</strong> (cahaya redup)</td></tr><tr><td><strong>Saraf optik</strong></td><td>meneruskan sinyal dari retina ke otak</td></tr></tbody></table></div> <h3>Daya akomodasi</h3> <p><strong>Akomodasi</strong> adalah kemampuan mata mengubah kecembungan lensa agar bayangan selalu jatuh tepat di retina.</p> <div class=\"tw\"><table><thead><tr><th><strong>Melihat benda</strong></th><th><strong>Otot siliaris</strong></th><th><strong>Lensa mata</strong></th><th><strong>Jarak fokus</strong></th></tr></thead><tbody><tr><td><strong>Dekat</strong></td><td>berkontraksi (menegang)</td><td>lebih <strong>cembung</strong></td><td>lebih pendek</td></tr><tr><td><strong>Jauh</strong></td><td>berelaksasi (mengendur)</td><td>lebih <strong>pipih</strong></td><td>lebih panjang</td></tr></tbody></table></div> <p>Mata normal punya <strong>titik dekat (PP) ±25 cm</strong> (benda terdekat yang masih tampak jelas) dan <strong>titik jauh (PR) tak terhingga</strong>. Lama menatap layar dari jarak dekat membuat otot siliaris lelah.</p>"}, {"c": 4, "t": "4.2 Kelainan Mata dan Kacamata (pembahasan Bank Soal No. 24)", "i": "Bab 4 · Alat Optik", "b": "<div class=\"tw\"><table><thead><tr><th><strong>Kelainan</strong></th><th><strong>Masalah</strong></th><th><strong>Bayangan jatuh</strong></th><th><strong>Penyebab</strong></th><th><strong>Kacamata</strong></th></tr></thead><tbody><tr><td><strong>Miopi (rabun jauh)</strong></td><td>sulit melihat benda <strong>jauh</strong></td><td>di <strong>depan</strong> retina</td><td>bola mata terlalu panjang atau lensa terlalu cembung</td><td>lensa <strong>cekung (negatif)</strong></td></tr><tr><td><strong>Hipermetropi (rabun dekat)</strong></td><td>sulit melihat benda <strong>dekat</strong></td><td>di <strong>belakang</strong> retina</td><td>bola mata terlalu pendek atau lensa terlalu pipih</td><td>lensa <strong>cembung (positif)</strong></td></tr><tr><td><strong>Presbiopi (mata tua)</strong></td><td>sulit melihat dekat karena usia</td><td>—</td><td>daya akomodasi menurun karena lensa makin kaku</td><td>lensa <strong>rangkap (bifokal)</strong></td></tr><tr><td><strong>Astigmatisma</strong></td><td>penglihatan kabur pada arah tertentu</td><td>—</td><td>kornea atau lensa tidak bulat sempurna</td><td>lensa <strong>silinder</strong></td></tr></tbody></table></div> <div class=\"co g\"><strong>🎯 TRIK INGAT</strong> <strong>MIOPI → MINUS (cekung)</strong>. <strong>HIPERMETROPI → PLUS (cembung)</strong>. Lensa minus \"memundurkan\" bayangan ke retina, lensa plus \"memajukannya\".</div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Soal No. 24</strong> Tentukan benar atau salah: (1) Miopi memerlukan lensa cekung. (2) Hipermetropi memerlukan lensa cekung. (3) Presbiopi terjadi karena berkurangnya daya akomodasi dan dibantu kacamata bifokal.&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; <strong>Benar.</strong> Miopi: bayangan jatuh di depan retina, dibantu lensa cekung (negatif) yang menggeser bayangan ke retina.&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; <strong>Salah.</strong> Hipermetropi memerlukan lensa <strong>cembung</strong> (positif). Lensa cekung dipakai untuk miopi.&lt;br&gt;&lt;strong&gt;3.&lt;/strong&gt; <strong>Benar.</strong> Presbiopi akibat usia; lensa makin kaku sehingga akomodasi menurun, biasanya dibantu kacamata bifokal.</div> <h3>Menentukan kacamata yang tepat (pengayaan)</h3> <div class=\"fm\"><strong>Miopi: P = −100 ÷ PR        Hipermetropi: P = 4 − 100 ÷ PP</strong></div> <p>PR = titik jauh dan PP = titik dekat penderita (dalam <strong>cm</strong>); P dalam dioptri. Angka 4 berasal dari 100 ÷ 25 (jarak baca normal 25 cm).</p> <div class=\"co\"><strong>✏️ CONTOH SOAL — Kacamata miopi</strong> Seorang penderita miopi hanya dapat melihat jelas benda sampai jarak <strong>200 cm</strong>. Berapa daya kacamata yang dibutuhkan?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; PR = 200 cm. Lensa harus membuat benda jauh tampak berada di 200 cm.&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; P = −100 ÷ PR = −100 ÷ 200 = <strong>−0,5 dioptri</strong> (lensa cekung)</div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Kacamata hipermetropi</strong> Penderita hipermetropi tidak dapat melihat jelas benda yang lebih dekat dari <strong>50 cm</strong>. Berapa daya kacamata baca yang dibutuhkan?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; PP = 50 cm. Agar benda di 25 cm tampak berada di 50 cm:&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; P = 4 − 100 ÷ PP = 4 − 100 ÷ 50 = 4 − 2 = <strong>+2 dioptri</strong> (lensa cembung)</div> <div class=\"co w\"><strong>👀 JAGA KESEHATAN MATA</strong> Baca pada jarak ±30 cm dengan cahaya yang cukup, jangan sambil tiduran. Setiap 20 menit memakai layar, lihat benda jauh selama 20 detik agar otot mata rileks. Makan sayur dan buah (misalnya wortel) yang mengandung vitamin A. Jangan menggosok mata dengan tangan kotor; periksakan mata secara berkala.</div>"}, {"c": 4, "t": "4.3 Kamera", "i": "Bab 4 · Alat Optik", "b": "<p>Kamera memakai <strong>lensa cembung</strong> untuk membentuk bayangan <strong>nyata, terbalik, dan diperkecil</strong> pada film atau sensor. Benda yang difoto berada di <strong>ruang III</strong> lensa (di luar 2F).</p> <div class=\"tw\"><table><thead><tr><th><strong>Bagian kamera</strong></th><th><strong>Padanan pada mata</strong></th><th><strong>Fungsi</strong></th></tr></thead><tbody><tr><td><strong>Lensa</strong></td><td>lensa mata</td><td>memfokuskan cahaya</td></tr><tr><td><strong>Diafragma</strong></td><td>iris dan pupil</td><td>mengatur banyak cahaya yang masuk</td></tr><tr><td><strong>Sensor atau film</strong></td><td>retina</td><td>tempat bayangan terbentuk</td></tr><tr><td><strong>Rana (shutter)</strong></td><td>kelopak mata</td><td>mengatur lama cahaya masuk</td></tr><tr><td><strong>Ruang gelap</strong></td><td>bola mata</td><td>mencegah cahaya lain masuk</td></tr></tbody></table></div> <div class=\"co w\"><strong>🤔 TAHUKAH KAMU?</strong> Pada <strong>kamera</strong>, fokus diatur dengan <strong>menggeser lensa</strong> maju-mundur. Pada <strong>mata</strong>, fokus diatur dengan <strong>mengubah kecembungan lensa</strong>. Prinsipnya sama, caranya berbeda!</div>"}, {"c": 4, "t": "4.4 Lup (Kaca Pembesar)", "i": "Bab 4 · Alat Optik", "b": "<p>Lup adalah <strong>sebuah lensa cembung</strong> yang dipakai dengan meletakkan benda di <strong>ruang I</strong> (antara O dan F). Bayangannya <strong>maya, tegak, dan diperbesar</strong>.</p> <div class=\"fm\"><strong>Tanpa akomodasi: M = 25 ÷ f        Akomodasi maksimum: M = (25 ÷ f) + 1</strong></div> <p>f dalam <strong>cm</strong>. Tanpa akomodasi, mata rileks dan benda diletakkan tepat di titik fokus; dengan akomodasi maksimum, bayangan berada di titik dekat mata (25 cm).</p> <div class=\"co\"><strong>✏️ CONTOH SOAL</strong> Sebuah lup berjarak fokus <strong>5 cm</strong>. Berapa perbesaran sudutnya pada kondisi tanpa akomodasi dan akomodasi maksimum?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; Tanpa akomodasi: M = 25 ÷ f = 25 ÷ 5 = <strong>5 kali</strong>&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; Akomodasi maksimum: M = 25 ÷ 5 + 1 = <strong>6 kali</strong></div> <p><strong>Pemakai lup:</strong> tukang arloji, kolektor perangko, ilmuwan yang mengamati serangga atau tumbuhan.</p>"}, {"c": 4, "t": "4.5 Mikroskop", "i": "Bab 4 · Alat Optik", "b": "<p>Mikroskop dipakai untuk melihat benda yang <strong>sangat kecil</strong> (sel, bakteri). Ia memiliki <strong>dua lensa cembung</strong>: <strong>lensa objektif</strong> (dekat benda, berjarak fokus pendek) dan <strong>lensa okuler</strong> (dekat mata, berfungsi seperti lup).</p> <div class=\"tw\"><table><thead><tr><th><strong>Benda</strong> <strong>di dekat objektif</strong></th><th><strong>➜</strong></th><th><strong>Lensa objektif</strong> <strong>bayangan nyata, terbalik, diperbesar</strong></th><th><strong>➜</strong></th><th><strong>Lensa okuler</strong> <strong>bekerja sebagai lup</strong></th><th><strong>➜</strong></th><th><strong>Bayangan akhir</strong> <strong>maya, terbalik, diperbesar</strong></th></tr></thead><tbody></tbody></table></div> <div class=\"fm\"><strong>M total = M objektif × M okuler</strong></div> <div class=\"co\"><strong>✏️ CONTOH SOAL</strong> Mikroskop memakai lensa objektif <strong>40×</strong> dan lensa okuler <strong>10×</strong>. Berapa perbesaran totalnya?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; M total = M objektif × M okuler = 40 × 10 = <strong>400 kali</strong></div> <p><strong>Bagian utama:</strong> lensa okuler, tabung, revolver (pemutar lensa objektif), lensa objektif, meja benda (preparat), cermin atau lampu, dan pemutar fokus kasar-halus.</p>"}, {"c": 4, "t": "4.6 Teropong (Teleskop)", "i": "Bab 4 · Alat Optik", "b": "<p>Teropong dipakai untuk melihat benda yang <strong>sangat jauh</strong>. Lensa objektif berjarak fokus <strong>panjang</strong>, sedangkan lensa okuler berjarak fokus <strong>pendek</strong>.</p> <div class=\"tw\"><table><thead><tr><th><strong>Jenis teropong</strong></th><th><strong>Ciri</strong></th><th><strong>Dipakai untuk</strong></th></tr></thead><tbody><tr><td><strong>Teropong bintang (refraktor)</strong></td><td>dua lensa cembung; bayangan akhir maya, <strong>terbalik</strong>, diperbesar</td><td>mengamati bintang dan planet</td></tr><tr><td><strong>Teropong bumi</strong></td><td>tiga lensa cembung; bayangan <strong>tegak</strong></td><td>mengamati pemandangan jauh di bumi</td></tr><tr><td><strong>Teropong prisma (binokuler)</strong></td><td>prisma membalik bayangan; bayangan <strong>tegak</strong>, tubuh lebih pendek</td><td>mengintai burung, pengamatan jarak jauh</td></tr><tr><td><strong>Teropong panggung (Galileo)</strong></td><td>okuler lensa cekung; bayangan <strong>tegak</strong></td><td>teropong opera dan teater</td></tr><tr><td><strong>Teropong pantul</strong></td><td>objektif berupa <strong>cermin cekung</strong> besar</td><td>teleskop astronomi berukuran besar</td></tr></tbody></table></div> <div class=\"fm\"><strong>M = f objektif ÷ f okuler        Panjang tubus: d = f objektif + f okuler</strong></div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Teropong bintang</strong> Teropong bintang memiliki lensa objektif berfokus <strong>100 cm</strong> dan lensa okuler berfokus <strong>5 cm</strong> (tanpa akomodasi). Berapa perbesaran dan panjang tubusnya?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; Perbesaran: M = f_ob ÷ f_ok = 100 ÷ 5 = <strong>20 kali</strong>&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; Panjang tubus: d = f_ob + f_ok = 100 + 5 = <strong>105 cm</strong></div>"}, {"c": 4, "t": "4.7 Alat Optik Lainnya", "i": "Bab 4 · Alat Optik", "b": "<div class=\"tw\"><table><thead><tr><th><strong>Alat</strong></th><th><strong>Komponen</strong></th><th><strong>Cara kerja</strong></th></tr></thead><tbody><tr><td><strong>Periskop</strong></td><td>dua cermin datar atau prisma sejajar, miring 45°</td><td>memantulkan cahaya dua kali sehingga kita bisa melihat dari tempat tersembunyi (kapal selam)</td></tr><tr><td><strong>Proyektor</strong></td><td>lensa cembung</td><td>film diletakkan di ruang II sehingga bayangan nyata, terbalik, diperbesar jatuh di layar</td></tr><tr><td><strong>Kaleidoskop</strong></td><td>tiga cermin datar membentuk sudut</td><td>pantulan berulang menghasilkan pola simetris yang indah</td></tr><tr><td><strong>Kamera lubang jarum</strong></td><td>kotak gelap dengan lubang kecil</td><td>cahaya lurus membentuk bayangan nyata dan terbalik di dalam kotak</td></tr><tr><td><strong>Serat optik</strong></td><td>serat kaca yang sangat tipis</td><td>pemantulan sempurna membawa cahaya sepanjang serat; dipakai untuk internet dan endoskopi</td></tr></tbody></table></div> <h3>Rangkuman alat optik</h3> <div class=\"tw\"><table><thead><tr><th><strong>Alat</strong></th><th><strong>Lensa / cermin</strong></th><th><strong>Sifat bayangan akhir</strong></th></tr></thead><tbody><tr><td><strong>Mata</strong></td><td>lensa cembung (lensa mata)</td><td>nyata, terbalik, diperkecil (di retina)</td></tr><tr><td><strong>Kamera</strong></td><td>lensa cembung</td><td>nyata, terbalik, diperkecil</td></tr><tr><td><strong>Lup</strong></td><td>satu lensa cembung</td><td>maya, tegak, diperbesar</td></tr><tr><td><strong>Mikroskop</strong></td><td>dua lensa cembung (objektif + okuler)</td><td>maya, terbalik, diperbesar</td></tr><tr><td><strong>Teropong bintang</strong></td><td>dua lensa cembung (objektif + okuler)</td><td>maya, terbalik, diperbesar</td></tr></tbody></table></div> <div class=\"co w\"><strong>🔬 COBA DI RUMAH</strong> <strong>Kamera lubang jarum:</strong> lubangi bagian tengah kardus tertutup, tempelkan kertas minyak di sisi seberang, lalu arahkan lubang ke lampu atau jendela terang. Bayangan <strong>terbalik</strong> akan muncul di kertas. <strong>Lup dari air:</strong> teteskan air ke plastik bening di atas tulisan kecil, huruf tampak membesar.</div> <div class=\"fm\"><strong>BONUS</strong></div> <div class=\"co\"><strong>🎒 RUMUS SAKTI &amp; CONTEKAN</strong> <em>Simpan halaman ini untuk persiapan ulangan</em></div>"}, {"c": 4, "t": "Coba sendiri · Soal 1", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Seorang penderita rabun jauh (miopi) memakai kacamata berlensa apa? Mengapa?", "a": "Lensa <strong>cekung (negatif)</strong>, karena bayangan jatuh di depan retina dan harus digeser mundur ke retina."}, {"c": 4, "t": "Coba sendiri · Soal 2", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Sebuah lup berfokus 10 cm. Berapa perbesarannya tanpa akomodasi?", "a": "M = 25 ÷ 10 = <strong>2,5 kali</strong>"}, {"c": 4, "t": "Coba sendiri · Soal 3", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Lensa objektif mikroskop 20× dan lensa okuler 15×. Berapa perbesaran totalnya?", "a": "M = 20 × 15 = <strong>300 kali</strong>"}, {"c": 4, "t": "Coba sendiri · Soal 4", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Apa fungsi pupil, dan apa yang terjadi pada pupil di tempat sangat terang?", "a": "Pupil adalah celah tempat cahaya masuk; di tempat terang pupil <strong>mengecil</strong> agar cahaya yang masuk tidak berlebihan."}, {"c": 4, "t": "Coba sendiri · Soal 5", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Apa kesamaan dan perbedaan cara memfokus pada kamera dan mata?", "a": "Sama-sama memakai lensa cembung. Kamera <strong>menggeser lensa</strong>, mata <strong>mengubah kecembungan lensa</strong>."}, {"c": 5, "t": "Rumus Sakti", "i": "Rumus & Glosarium", "b": "<div class=\"tw\"><table><thead><tr><th><strong>Topik</strong></th><th><strong>Rumus</strong></th><th><strong>Keterangan</strong></th></tr></thead><tbody><tr><td><strong>Periode dan frekuensi</strong></td><td>T = t ÷ n;  f = n ÷ t;  f = 1 ÷ T</td><td>T dalam s, f dalam Hz</td></tr><tr><td><strong>Bandul sederhana</strong></td><td>T = 2π√(l ÷ g)</td><td>tidak bergantung massa</td></tr><tr><td><strong>Cepat rambat gelombang</strong></td><td>v = λ × f = λ ÷ T</td><td>λ dalam m</td></tr><tr><td><strong>Jarak dari bunyi pantul</strong></td><td>s = (v × t) ÷ 2</td><td>bunyi pergi-pulang</td></tr><tr><td><strong>Jarak petir</strong></td><td>s = v × t</td><td>v bunyi ≈ 340 m/s</td></tr><tr><td><strong>Hukum pemantulan</strong></td><td>i = r</td><td>sudut diukur dari garis normal</td></tr><tr><td><strong>Bayangan dua cermin datar</strong></td><td>n = (360° ÷ θ) − 1</td><td>θ = sudut antar cermin</td></tr><tr><td><strong>Cermin lengkung</strong></td><td>1/f = 1/s + 1/s′;  M = │s′÷s│;  R = 2f</td><td>cekung f (+), cembung f (−)</td></tr><tr><td><strong>Indeks bias</strong></td><td>n = c ÷ v;  n₁ sin i = n₂ sin r</td><td>pengayaan</td></tr><tr><td><strong>Lensa dan daya lensa</strong></td><td>1/f = 1/s + 1/s′;  P = 100 ÷ f (cm)</td><td>P dalam dioptri</td></tr><tr><td><strong>Kacamata</strong></td><td>miopi P = −100 ÷ PR;  hipermetropi P = 4 − 100 ÷ PP</td><td>PR, PP dalam cm</td></tr><tr><td><strong>Lup</strong></td><td>M = 25 ÷ f (tanpa akomodasi);  M = 25 ÷ f + 1</td><td>f dalam cm</td></tr><tr><td>< s / sejajar arah rambat</td></tr><tr><td><strong>Resonansi</strong></td><td>ikut bergetarnya benda karena frekuensi sama</td></tr><tr><td><strong>Gema</strong></td><td>bunyi pantul yang terdengar terpisah dari bunyi asli</td></tr><tr><td><strong>Infrasonik / ultrasonik</strong></td><td>bunyi di bawah 20 Hz / di atas 20.000 Hz</td></tr><tr><td><strong>Pemantulan</strong></td><td>cahaya memantul dari permukaan (i = r)</td></tr><tr><td><strong>Pembiasan</strong></td><td>cahaya membelok saat berpindah medium</td></tr><tr><td><strong>Dispersi</strong></td><td>penguraian cahaya putih menjadi warna-warni</td></tr><tr><td><strong>Bayangan nyata / maya</strong></td><td>dapat ditangkap layar / tidak dapat ditangkap layar</td></tr><tr><td><strong>Titik fokus (F)</strong></td><td>titik kumpul (atau sumber semu) sinar sejajar sumbu utama</td></tr><tr><td><strong>Akomodasi</strong></td><td>kemampuan mata mengubah kecembungan lensa</td></tr><tr><td><strong>Miopi / hipermetropi</strong></td><td>rabun jauh (kacamata cekung) / rabun dekat (kacamata cembung)</td></tr><tr><td><strong>Dioptri (D)</strong></td><td>satuan daya lensa; P = 1 ÷ f (dalam meter)</td></tr></tbody></table></div> <div class=\"co\"><strong>🏁 SIAP LATIHAN?</strong> Selamat, kamu sudah menjelajahi <strong>getaran, gelombang, cahaya, dan alat optik</strong>! Sekarang uji kemampuanmu dengan mengerjakan <strong>Soal No. 20 (Getaran)</strong>, <strong>No. 24 (Alat Optik)</strong>, dan <strong>No. 28 (Gelombang Gempa)</strong> di Bank Soal IPA. Coba kerjakan dulu tanpa melihat pembahasan, lalu cocokkan jawabanmu. Ingat: fisika itu bukan hafalan rumus semata, tetapi memahami <strong>cerita di balik rumus</strong>. Semangat! 💪</div> <p>Belajar fisika itu seru! • Halaman</p> <p>Belajar fisika itu seru! • Halaman</p> <p>Belajar fisika itu seru! • Halaman</p> <p>Belajar fisika itu seru! • Halaman</p> <p>Belajar fisika itu seru! • Halaman</p>"}],BN1=['Pengantar','Bab 1 · Getaran','Bab 2 · Gelombang','Bab 3 · Cahaya','Bab 4 · A (r?'<div class="pill">📖 MATERI · kartu '+(MI+1)+' dari '+n+'</div><h2>'+d.t+'</h2><p class="q">'+d.i+'</p><div class="rc">'+d.b+(d.q?'<div class="co w">'+d.q+'</div>'+(RK[MI]?'<div class="an good">'+d.a+'</div>':'<button class="pr" data-a="rk">Lihat jawaban</button>'):'')+'</div>':'<div class="pill">🎯 TANTANGAN '+qn+' / '+nq+'</div><h2>'+d[1]+'</h2><p class="q">'+d[2]+'</p>'+
(d[4]?'<div class="op">'+d[4].map(o=>'<button data-a="c:'+o+'" class="'+(a?(o==d[5]?'ok':a.v==o?'no':''):'')+'"'+(a?' disabled':'')+'>'+o+'</button>').join('')+'</div>':'<div class="nm"><input id="mi" inputmode="decimal" placeholder="Jawabanmu ('+d[7]+')" value="'+(a?esc(a.v):'')+'"'+(a?' disabled':'')+'>'+(a?'':'<button class="pr" data-a="ck">Cek jawaban</button>')+'</div>')+
(a?'<div class="an '+(a.ok?'good':'bad')+'">'+(a.ok?'✔ Benar! ':'✘ Belum tepat. ')+d[3]+'</div>':''))+
'<div class="nv">'+(MI?'<button data-a="mp">◀ Sebelumnya</button>':'')+(r||a?'<button class="pr" data-a="mn">'+(MI==n-1?'Selesai':'Lanjut ▶')+'</button>':'')+'</div></div>')}
function lat(){base();if(LI>LV)LV=LI;const L=LAT[LI],a=LA[LI],g=role=='guru',rv=g?RV:a!=null,A='ABCD';vw(hd('Latihan · Soal '+(LI+1)+' dari '+LAT.length,'b0')+'<div class="bd"><div class="pill">'+(g?'MODE PENGAJAR':'MODE SISWA')+'</div><h2>'+L.t+'</h2><p class="q">'+L.q+'</p><div class="op">'+L.o.map((o,k)=>'<button data-a="o'+k+'" class="'+(rv&&k==L.a?'ok':a==k?'no':'')+'"'+(g||a!=null?' disabled':'')+'><i>'+A[k]+'</i>'+o+'</button>').join('')+'</div>'+(g&&!rv?'<button class="pr" data-a="rv">Tampilkan jawaban</button>':'')+
(rv?'<div class="an '+(g||a==L.a?'good':'bad')+'">'+(g?'✅ JAWABAN: '+A[L.a]+' · '+L.o[L.a]:a==L.a?'✔ Benar! Jawabannya '+A[L.a]+'.':'✘ Belum tepat. Jawaban yang benar: '+A[L.a]+'.')+'</div><button class="pr" data-a="pm">Lanjut ke wahana pembahasan ▶</button>':'')+(LI?'<div class="nv"><button data-a="lp">◀ Soal sebelumnya</button></div>':'')+'</div>')}
function lfin(){base();LV=LAT.length;const ok=Object.keys(LA).filter(k=>LA[k]==LAT[k].a).length;vw(hd('Latihan · Selesai','b0')+'<div class="bd"><h2>🎉 Latihan selesai!</h2><p class="q">'+(role=='guru'?'Semua soal dan pembahasan sudah dibahas.':'Kamu menjawab benar '+ok+' dari '+LAT.length+' soal.')+'</p><button class="pr" data-a="lr">Ulangi latihan</button></div>')}

Object.assign(S,{_f:S.fl,_r:S.rows,_s:{...S.s},fl:{},rows:[],fb:null,dirty:0,pre:role=='guru'?L.pre:null});Object.assign(S.s,S.pre||S.def);S.rst();sel(L.st);

const pmh=()=>{const L=LAT[LI];if(role!='guru')return'<div class="pmb tip"><b>🎮 KERJAKAN SENDIRI!</b>'+L.sk+'</div>';return'<div class="pmb in"><b>💡 INTINYA</b>'+L.in+'</div><div class="pmb"><b>🪜 LANGKAH</b><ol>'+L.ln.map(x=>'<li>'+x+'</li>').join('')+'</ol></div><div class="pmb"><b>🔍 CEK SATU PER SATU</b>'+L.ck.map(c=>'<p class="'+(c[0]?'t':'f')+'"><em>'+(c[0]?'✔ TEPAT':'✘ KELIRU')+'</em>'+c[1]+'</p>').join('')+'</div><div class="pmb tr"><b>🎯 TRIK INGAT</b>'+L.tr+'</div><div class="pmb tip"><b>🎮 PERAGAKAN DI WAHANA</b>'+L.dm+'</div>'};
function act(a){if(a=='out')out();else if(a=='home')go('home');else if(a=='e0'||a=='e1')go(a=='e0'?'energi':'gelombang');else if(a=='b0')go(BAB?'gelombang':'energi');else if(a=='wah')go('wahana');else if(a=='misi'||a=='mr'){if(a=='mr'){clr(MA);clr(RK);MV=0;MI=0}else MI=MV>=MQ.length?0:MV;go('misi')}else if(a=='lat'||a=='lr'){if(a=='lr'){clr(LA);LV=0;LI=0}else LI=LV>=LAT.length?0:LV;RV=0;go('latihan')}
else if(a[0]=='o'&&a.length==2){LA[LI]=+a[1];lat()}else if(a=='rv'){RV=1;lat()}else if(a=='lp'){LI--;RV=1;lat()}else if(a=='pm')go('pembahasan');else if(a=='mn'){MI++;misi()}else if(a=='rk'){RK[MI]=1;misi()}else if(a[0]=='j'){MI=MQ.findIndex(x=>(Array.isArray(x)?x[0]:x.c)==+a[1]);misi()}else if(a=='mp'){MI--;misi()}
else if(a[0]=='c'&&a[1]==':'){const v=a.slice(2);MA[MI]={v,ok:chk(MQ[MI],v)};misi()}else if(a=='ck'){const v=$('#mi').value;if(v.trim()){MA[MI]={v,ok:chk(MQ[MI],v)};misi()}}}

$('#bk').onclick=()=>go(BAB?'gelombang':'energi');
const go=n=>{location.hash.slice(1)==n?route():location.hash=n};
function route(){if(!role)return;const h=location.hash.slice(1);if(LI>=LAT.length)LI=LAT.length-1;if(h=='energi')menu(0);else if(h=='gelombang')menu(1);else if(h=='wahana')wah();else if(h=='misi')misi();else if(h=='latihan')lat();else if(h=='pembahasan')pm();else if(h=='selesai')lfin();else home()}
window.onhashchange=route;
$('#pmbar').onclick=e=>{const p=e.target.dataset.p;if(!p)return;endPM();if(p=='m')go(BAB?'gelombang':'energi');else if(p=='s')go('latihan');else{LI++;RV=0;go(LI<LAT.length?'latihan':'selesai')}};
let role='';

$('#lg').style.display='none';const m=$('#me'),t=document.createElement('span'),b=document.createElement('button');m.style.display='flex';m.innerHTML='';t.textContent=n+' · '+(role=='guru'?'Guru':'Siswa');b.textContent='Keluar';b.onclick=out;m.append(t,b);$('#key').classList.remove('on');panel();NM=n;loadPG();route()}
