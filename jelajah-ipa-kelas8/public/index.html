const MQ0=[{"c": 0, "t": "Selamat datang di ekspedisi IPA", "i": "Tiga bab, banyak tantangan nyata. Di sini kamu akan menguji ide, menghitung, dan menemukan fisika di sekitar kita.", "b": "<h2>Mulai dari pertanyaan, bukan hafalan</h2> <p>Bagaimana gaya bisa memindahkan benda? Ke mana energi pergi saat bola jatuh? Mengapa jalan menanjak dibuat berkelok? Kita akan menelusuri jawabannya dari <strong>usaha</strong>, ke <strong>energi</strong>, lalu ke <strong>pesawat sederhana</strong>.</p> <div class=\"fm\">Gaya → Usaha → Energi → Alat bantu</div> <p>Urutan ini saling menyambung: gaya dapat melakukan usaha, usaha memindahkan energi, dan pesawat sederhana membantu kita mengatur gaya serta jarak.</p> <div class=\"co w\">Catatan ekspedisi: gaya boleh terasa berat, tapi hitungan fisika tetap mengikuti bukti—apakah benda berpindah, searah mana, dan berapa jauh.</div> <h2>Peta perjalanan</h2> <div class=\"tw\"><table><thead><tr><th>Bab</th><th>Yang akan kamu selidiki</th></tr></thead><tbody><tr><td>01 · Usaha</td><td>Kapan gaya benar-benar melakukan usaha? Apa bedanya usaha dan daya?</td></tr><tr><td>02 · Energi</td><td>Bagaimana energi tersimpan, bergerak, berubah bentuk, dan tetap kekal?</td></tr><tr><td>03 · Pesawat sederhana</td><td>Bagaimana tuas, katrol, bidang miring, dan roda mengubah gaya?</td></tr><tr><td>Bekal akhir</td><td>Rumus penting, jebakan soal, dan glosarium mini.</td></tr></tbody></table></div> <p>Setiap bacaan ditutup dengan tantangan singkat. Progres dan jawabanmu tersimpan di perangkat ini.</p>"}, {"c": 1, "t": "Bab 1 · Usaha dalam fisika", "i": "Capek belum tentu berarti melakukan usaha menurut fisika. Kita perlu memeriksa tiga hal.", "b": "<h2>Gaya yang membuat benda berpindah</h2> <p>Dalam fisika, usaha adalah hasil kerja gaya yang menyebabkan benda berpindah. Agar usaha terjadi, harus ada gaya, benda harus berpindah, dan arah perpindahannya searah dengan gaya yang ditinjau.</p> <div class=\"tw\"><table><thead><tr><th>Syarat</th><th>Yang perlu dicek</th></tr></thead><tbody><tr><td>Ada gaya</td><td>Ada dorongan atau tarikan pada benda.</td></tr><tr><td>Ada perpindahan</td><td>Posisi benda berubah; jika diam, s = 0.</td></tr><tr><td>Searah</td><td>Perpindahan memiliki arah yang sama dengan gaya.</td></tr></tbody></table></div> <div class=\"co\">Jika satu syarat tidak terpenuhi, usaha oleh gaya tersebut bernilai nol. Menahan galon bisa melelahkan, tetapi galon tidak berpindah.</div> <p>Perhatikan arah gaya dan gerak, bukan hanya rasa capek. Saat tas dibawa mendatar, gaya tangan ke atas sedangkan perpindahan mendatar.</p>"}, [1, "Uji situasi · mobil mogok", "Mendorong mobil mogok hingga bergeser 5 m. Apakah gaya dorong melakukan usaha pada mobil?", "Ya. Ada gaya, mobil berpindah, dan perpindahan searah dengan gaya dorong.", ["Ya", "Tidak"], "Ya"], [1, "Uji situasi · tas ke meja", "Mengangkat tas dari lantai ke atas meja. Apakah gaya angkat melakukan usaha?", "Ya. Gaya angkat ke atas dan tas berpindah ke atas, searah dengan gaya.", ["Ya", "Tidak"], "Ya"], [1, "Uji situasi · buah jatuh", "Buah mangga jatuh dari pohon ke tanah. Apakah gaya berat melakukan usaha pada buah?", "Ya. Gaya berat dan perpindahan buah sama-sama mengarah ke bawah.", ["Ya", "Tidak"], "Ya"], [1, "Uji situasi · tembok diam", "Mendorong tembok sekuat tenaga, tetapi tembok tetap diam. Apakah gaya dorong melakukan usaha pada tembok?", "Tidak. Tidak ada perpindahan (s = 0), sehingga usaha pada tembok nol meskipun kita merasa lelah.", ["Ya", "Tidak"], "Tidak"], [1, "Uji situasi · menahan galon", "Menahan galon di udara tanpa membuatnya bergerak. Apakah gaya tangan melakukan usaha pada galon?", "Tidak. Galon tidak berpindah, maka usaha mekanik pada galon bernilai nol.", ["Ya", "Tidak"], "Tidak"], [1, "Uji situasi · tas dibawa mendatar", "Tas dibawa berjalan mendatar. Gaya tangan pada tas ke atas, sedangkan perpindahan mendatar. Apakah gaya tangan melakukan usaha pada tas?", "Tidak. Arah gaya angkat tidak searah dengan perpindahan mendatar.", ["Ya", "Tidak"], "Tidak"], [1, "Uji situasi · berpikir keras", "Berpikir keras mengerjakan soal ujian, tanpa gaya yang memindahkan sebuah benda. Apakah itu usaha dalam pengertian fisika?", "Tidak. Berpikir keras bukan gaya yang memindahkan benda, sehingga tidak memenuhi syarat usaha mekanik.", ["Ya", "Tidak"], "Tidak"], {"c": 1, "t": "Rumus usaha dan satuannya", "i": "Untuk gaya yang searah perpindahan, usaha adalah hasil kali gaya dan jarak perpindahan.", "b": "<div class=\"fm\">W = F × s<br><small>W dalam joule (J) · F dalam newton (N) · s dalam meter (m)</small></div> <p>Satu joule adalah usaha oleh gaya 1 N yang memindahkan benda sejauh 1 m: <strong>1 J = 1 N·m</strong>. Nama joule diambil dari fisikawan James Prescott Joule.</p> <div class=\"ex\"><div><b>1</b><span>Dani mendorong meja dengan F = 40 N sejauh s = 3 m.</span></div><div><b>2</b><span>W = F × s = 40 × 3.</span></div><div><b>3</b><span>Usaha Dani = 120 J.</span></div></div> <div class=\"ex\"><div><b>1</b><span>Lemari berpindah 4 m dengan usaha 600 J.</span></div><div><b>2</b><span>F = W ÷ s = 600 ÷ 4.</span></div><div><b>3</b><span>Gaya yang diberikan = 150 N.</span></div></div> <div class=\"co w\">Segitiga rumus: W = F × s; F = W ÷ s; s = W ÷ F. Pastikan satuannya cocok sebelum menghitung.</div>"}, {"c": 1, "t": "Usaha untuk mengangkat benda", "i": "Saat benda diangkat, kita melawan beratnya. Massa dalam kilogram harus diubah dulu menjadi berat dalam newton.", "b": "<div class=\"fm\">W = w × h = m × g × h<br><small>w = m × g · g ≈ 10 m/s² · h dalam meter</small></div> <div class=\"tw\"><table><thead><tr><th>Besaran</th><th>Makna</th><th>Satuan</th></tr></thead><tbody><tr><td>m</td><td>massa benda</td><td>kg</td></tr><tr><td>g</td><td>percepatan gravitasi, kira-kira 10</td><td>m/s²</td></tr><tr><td>w</td><td>berat, yaitu m × g</td><td>N</td></tr><tr><td>h</td><td>ketinggian perpindahan ke atas</td><td>m</td></tr></tbody></table></div> <div class=\"ex\"><div><b>1</b><span>Buku bermassa 2 kg diangkat setinggi 1,5 m.</span></div><div><b>2</b><span>Beratnya w = m × g = 2 × 10 = 20 N.</span></div><div><b>3</b><span>W = w × h = 20 × 1,5 = 30 J.</span></div></div> <div class=\"co w\">Massa 2 kg bukan gaya 2 N. Dekat permukaan Bumi, massa 2 kg memiliki berat kira-kira 20 N.</div>"}, {"c": 1, "t": "Daya · seberapa cepat usaha dilakukan?", "i": "Dua orang dapat melakukan usaha yang sama, tetapi yang menyelesaikannya lebih cepat menghasilkan daya lebih besar.", "b": "<div class=\"fm\">P = W ÷ t<br><small>P dalam watt (W) · W dalam joule · t dalam sekon (s)</small></div> <p><strong>1 W = 1 J/s</strong>; satu kilowatt (kW) sama dengan 1.000 watt. Lampu 10 W mengubah energi 10 J tiap sekon.</p> <div class=\"ex\"><div><b>1</b><span>Rina (berat 400 N) menaiki tangga setinggi 4 m dalam 8 s.</span></div><div><b>2</b><span>Usaha W = 400 × 4 = 1.600 J.</span></div><div><b>3</b><span>P = 1.600 ÷ 8 = 200 W.</span></div></div> <div class=\"co\">Usaha menjawab “berapa banyak kerja gaya?”, sedangkan daya menjawab “seberapa cepat kerja itu dilakukan?”.</div>"}, [1, "Coba sendiri · mendorong peti", "Gaya 25 N memindahkan peti sejauh 8 m searah gaya. Berapa usaha yang dilakukan? Masukkan angka.", "W = F × s = 25 × 8 = 200 J. Karena gaya searah perpindahan, kalikan gaya dengan jarak.", null, null, 200, "J"], [1, "Coba sendiri · karung ke bak truk", "Pak Budi mengangkat karung 30 kg setinggi 1,2 m dalam 3 s. Dengan g = 10 m/s², berapa usaha dan dayanya? Tulis keduanya berurutan, misalnya: 360; 120.", "Berat = 30 × 10 = 300 N. Usaha = 300 × 1,2 = 360 J; daya = 360 ÷ 3 = 120 W.", null, null, [360, 120], "J; W"], {"c": 2, "t": "Bab 2 · Energi ada di sekitar kita", "i": "Energi adalah kemampuan untuk melakukan usaha. Kita tidak melihat energi secara langsung, tetapi melihat akibatnya.", "b": "<h2>Bentuk energi</h2> <div class=\"tw\"><table><thead><tr><th>Bentuk</th><th>Ciri dan contoh</th></tr></thead><tbody><tr><td>Kinetik</td><td>Energi gerak: mobil melaju, angin, air mengalir.</td></tr><tr><td>Potensial</td><td>Energi tersimpan karena posisi atau keadaan: buah di pohon, air di bendungan, ketapel ditarik.</td></tr><tr><td>Kalor</td><td>Berpindah karena perbedaan suhu: api, setrika, sinar Matahari.</td></tr><tr><td>Cahaya</td><td>Membuat benda dapat dilihat: Matahari, lampu, senter.</td></tr><tr><td>Bunyi</td><td>Berasal dari getaran: speaker, bel, senar gitar.</td></tr><tr><td>Listrik</td><td>Berkaitan dengan muatan listrik: baterai, stopkontak, petir.</td></tr><tr><td>Kimia</td><td>Tersimpan dalam zat: makanan, bensin, baterai, kayu bakar.</td></tr><tr><td>Nuklir</td><td>Tersimpan dalam inti atom: PLTN dan Matahari.</td></tr></tbody></table></div> <div class=\"co w\">Bayangkan energi seperti saldo, dan usaha seperti penggunaan saldo. Saat usaha terjadi, energi berpindah atau berubah bentuk.</div>"}, {"c": 2, "t": "Energi potensial · energi tersimpan", "i": "Energi potensial gravitasi dimiliki benda karena ketinggiannya. Ada juga energi potensial elastis pada benda yang ditarik atau ditekan.", "b": "<div class=\"fm\">Ep = m × g × h<br><small>Ep dalam J · m dalam kg · g ≈ 10 m/s² · h dalam m</small></div> <p>Makin besar massa atau ketinggian benda, makin besar energi potensial gravitasinya. Ketinggian diukur dari bidang acuan, biasanya tanah.</p> <div class=\"ex\"><div><b>1</b><span>Kelapa bermassa 1,5 kg berada 10 m di atas tanah.</span></div><div><b>2</b><span>Ep = m × g × h = 1,5 × 10 × 10.</span></div><div><b>3</b><span>Energi potensial kelapa = 150 J.</span></div></div> <p>Usaha mengangkat benda berubah menjadi energi potensialnya. Karena itu, rumus usaha mengangkat dan Ep gravitasi sama-sama memuat m, g, dan h.</p>"}, [2, "Coba sendiri · ketinggian dan Ep", "Jika massa tetap, apa yang terjadi pada energi potensial gravitasi ketika ketinggian benda menjadi dua kali?", "Ep = m × g × h. Jika m dan g tetap, Ep berbanding lurus dengan h, sehingga ketinggian dua kali membuat Ep juga dua kali.", ["Menjadi dua kali lipat", "Tetap sama", "Menjadi setengahnya"], "Menjadi dua kali lipat"], {"c": 2, "t": "Energi kinetik · energi gerak", "i": "Semua benda yang bergerak memiliki energi kinetik. Kecepatan dikuadratkan, jadi perubahan kecepatan sangat berpengaruh.", "b": "<div class=\"fm\">Ek = ½ × m × v²<br><small>Ek dalam J · m dalam kg · v dalam m/s</small></div> <div class=\"ex\"><div><b>1</b><span>Sepeda dan pengendara bermassa total 50 kg melaju 6 m/s.</span></div><div><b>2</b><span>Ek = ½ × 50 × 6² = ½ × 50 × 36.</span></div><div><b>3</b><span>Energi kinetiknya = 900 J.</span></div></div> <div class=\"tw\"><table><thead><tr><th>Kecepatan mobil 1.000 kg</th><th>Energi kinetik</th><th>Perbandingan</th></tr></thead><tbody><tr><td>10 m/s (36 km/jam)</td><td>50.000 J</td><td>1 kali</td></tr><tr><td>20 m/s (72 km/jam)</td><td>200.000 J</td><td>4 kali</td></tr><tr><td>30 m/s (108 km/jam)</td><td>450.000 J</td><td>9 kali</td></tr></tbody></table></div> <div class=\"co w\">Jika kecepatan menjadi 2 kali, Ek menjadi 4 kali. Jangan lupa tanda ½ dan kuadrat v.</div>"}, [2, "Coba sendiri · mobil mainan", "Mobil mainan bermassa 0,5 kg melaju 4 m/s. Berapa energi kinetiknya? Masukkan angka.", "Ek = ½ × 0,5 × 4² = 0,25 × 16 = 4 J.", null, null, 4, "J"], {"c": 2, "t": "Energi mekanik dan kekekalan", "i": "Energi mekanik merupakan jumlah energi potensial dan kinetik. Saat benda bergerak, kedua bentuk itu dapat saling bertukar.", "b": "<div class=\"fm\">Em = Ep + Ek<br><small>Tanpa gesekan: Em awal = Em akhir</small></div> <p>Hukum kekekalan energi menyatakan energi tidak dapat diciptakan atau dimusnahkan; energi hanya berubah bentuk. Pada roller coaster, di puncak Ep besar. Saat meluncur turun, Ep berkurang sementara Ek bertambah. Di titik rendah, laju dan Ek paling besar.</p> <h2>Jatuh bebas</h2> <p>Bola 2 kg dijatuhkan dari ketinggian 5 m (g = 10 m/s²), hambatan udara diabaikan. Di atas, Ep = 2 × 10 × 5 = 100 J. Sesaat sebelum menyentuh tanah, energi itu menjadi Ek.</p> <div class=\"ex\"><div><b>1</b><span>mgh = ½mv²; massa m dapat dicoret.</span></div><div><b>2</b><span>gh = ½v², maka v² = 2gh.</span></div><div><b>3</b><span>v = √(2 × 10 × 5) = 10 m/s.</span></div></div> <div class=\"fm\">v = √(2 × g × h)<br><small>Jalan pintas kecepatan jatuh bebas ideal</small></div> <div class=\"co w\">Massa tidak memengaruhi kecepatan jatuh bebas ideal. Di dunia nyata hambatan udara dapat berpengaruh. Gesekan mengubah sebagian energi mekanik menjadi kalor dan bunyi, meski total energi tetap kekal.</div>"}, [2, "Coba sendiri · mangga jatuh", "Mangga 0,4 kg jatuh bebas dari ketinggian 20 m. Berapa kecepatannya sesaat sebelum menyentuh tanah? Gunakan g = 10 m/s². Masukkan angka.", "v = √(2gh) = √(2 × 10 × 20) = √400 = 20 m/s. Massa tidak diperlukan.", null, null, 20, "m/s"], {"c": 2, "t": "Transformasi energi dan efisiensi", "i": "Energi tidak hilang: alat mengubah energi masukan menjadi bentuk lain, termasuk bentuk yang tidak kita inginkan.", "b": "<div class=\"tw\"><table><thead><tr><th>Alat atau peristiwa</th><th>Perubahan energi</th></tr></thead><tbody><tr><td>Kipas angin</td><td>Listrik → gerak + sedikit bunyi dan kalor</td></tr><tr><td>Setrika / lampu</td><td>Listrik → kalor / cahaya + kalor</td></tr><tr><td>Baterai / aki</td><td>Kimia → listrik</td></tr><tr><td>Panel surya</td><td>Cahaya → listrik</td></tr><tr><td>Fotosintesis</td><td>Cahaya → kimia dalam makanan</td></tr><tr><td>Tubuh setelah makan</td><td>Kimia → gerak + kalor</td></tr><tr><td>Speaker / kompor gas</td><td>Listrik → bunyi / kimia → kalor + cahaya</td></tr><tr><td>Mobil bensin</td><td>Kimia → kalor → gerak</td></tr></tbody></table></div> <p><strong>PLTA:</strong> air di bendungan (Ep) → air mengalir (Ek) → turbin berputar → generator menghasilkan listrik.</p> <div class=\"fm\">η = (energi berguna ÷ energi masukan) × 100%</div> <p>Lampu pijar mengubah 20 J listrik menjadi 4 J cahaya berguna: efisiensinya 4 ÷ 20 × 100% = 20%. Sisanya menjadi kalor, bukan lenyap. LED lebih efisien karena porsi energi menjadi cahaya lebih besar.</p>"}, {"c": 2, "t": "Energi listrik, kWh, dan pilihan sumber", "i": "Pemakaian energi listrik bergantung pada daya alat dan lamanya menyala. Kita juga bisa memilih energi dengan dampak berbeda.", "b": "<div class=\"fm\">E = P × t<br><small>Untuk tagihan, P dalam kW dan t dalam jam menghasilkan kWh.</small></div> <p>Contoh: lampu 10 W menyala 5 jam per hari selama 30 hari. E = 10 × 150 = 1.500 Wh = <strong>1,5 kWh</strong>. Satu kWh = 1.000 W × 1 jam = 3.600.000 J.</p> <div class=\"tw\"><table><thead><tr><th>Sumber</th><th>Contoh</th><th>Ciri</th></tr></thead><tbody><tr><td>Tak terbarukan</td><td>Minyak bumi, gas alam, batu bara</td><td>Persediaan terbatas; terbentuk kembali sangat lama; pembakarannya menghasilkan polusi dan gas rumah kaca.</td></tr><tr><td>Terbarukan</td><td>Matahari, angin, air, panas bumi, biomassa, gelombang laut</td><td>Terus tersedia atau pulih relatif cepat; umumnya lebih ramah lingkungan.</td></tr></tbody></table></div> <p>Contoh pembangkit: PLTU (batu bara), PLTD (diesel), PLTG (gas), PLTS (surya), PLTB (bayu), PLTA (air), PLTP (panas bumi), PLTBm (biomassa). Indonesia memiliki potensi panas bumi karena berada di jalur Cincin Api Pasifik.</p> <div class=\"co w\">Jurus hemat energi: matikan alat yang tidak dipakai, pilih LED dan alat hemat daya, cabut pengisi daya setelah digunakan, serta berjalan kaki, bersepeda, atau naik angkutan umum untuk jarak dekat.</div>"}, [2, "Coba sendiri · energi potensial", "Batu 2 kg berada di atap setinggi 6 m. Berapa energi potensialnya jika g = 10 m/s²? Masukkan angka.", "Ep = 2 × 10 × 6 = 120 J.", null, null, 120, "J"], {"c": 3, "t": "Bab 3 · Pesawat sederhana", "i": "Alat sederhana membantu pekerjaan terasa lebih mudah—tanpa menghapus usaha yang harus dilakukan.", "b": "<h2>Gaya lebih kecil, jarak lebih jauh</h2> <p>Pesawat sederhana dapat memperkecil gaya, mengubah arah gaya, atau mengubah jarak maupun kecepatan gerak. Empat kelompoknya: tuas, katrol, bidang miring, dan roda berporos.</p> <div class=\"fm\">Usaha kuasa = usaha beban<br><small>F × s = w × h · berlaku pada keadaan ideal tanpa gesekan</small></div> <p>Keuntungan mekanik (KM) menyatakan berapa kali gaya diperkuat: <strong>KM = w ÷ F</strong>. KM = 6 artinya beban 600 N idealnya dapat diangkat dengan gaya 100 N.</p> <div class=\"co w\">Pesawat sederhana tidak mengurangi usaha. Gaya yang lebih kecil dibayar dengan jarak yang lebih panjang.</div>"}, {"c": 3, "t": "Tuas · kenali tiga bagiannya", "i": "Tuas adalah batang kaku yang berputar pada satu titik tetap. Kenali posisi tumpu, beban, dan kuasa.", "b": "<div class=\"tw\"><table><thead><tr><th>Bagian</th><th>Simbol</th><th>Artinya</th></tr></thead><tbody><tr><td>Titik tumpu</td><td>T</td><td>Poros putaran tuas.</td></tr><tr><td>Titik beban</td><td>B</td><td>Tempat beban berada; gaya beban dilambangkan w.</td></tr><tr><td>Titik kuasa</td><td>K</td><td>Tempat gaya yang kita berikan; dilambangkan F.</td></tr><tr><td>Lengan beban</td><td>Lb</td><td>Jarak dari tumpu ke beban.</td></tr><tr><td>Lengan kuasa</td><td>Lk</td><td>Jarak dari tumpu ke kuasa.</td></tr></tbody></table></div> <div class=\"fm\">w × Lb = F × Lk<br><small>KM = w ÷ F = Lk ÷ Lb</small></div> <p>Makin panjang lengan kuasa dibanding lengan beban, makin kecil gaya yang diperlukan. Untuk tuas seimbang, momen di kedua sisi sama.</p> <div class=\"ex\"><div><b>1</b><span>Batu bermassa 60 kg, Lb = 0,5 m, kemampuan gaya 100 N.</span></div><div><b>2</b><span>Berat batu w = 60 × 10 = 600 N; KM = 600 ÷ 100 = 6.</span></div><div><b>3</b><span>Lk = KM × Lb = 6 × 0,5 = 3 m.</span></div><div><b>4</b><span>Cek momen: 600 × 0,5 = 100 × 3 = 300 N·m.</span></div></div>"}, {"c": 3, "t": "Tiga golongan tuas", "i": "Lihat bagian mana yang berada di tengah. Trik cepat: T–B–K berarti golongan I–II–III.", "b": "<div class=\"tw\"><table><thead><tr><th>Golongan</th><th>Yang di tengah</th><th>KM / efek</th><th>Contoh</th></tr></thead><tbody><tr><td>I</td><td>Tumpu</td><td>KM bisa &gt; 1, = 1, atau &lt; 1</td><td>Gunting, tang, jungkat-jungkit, linggis, timbangan lengan</td></tr><tr><td>II</td><td>Beban</td><td>Selalu &gt; 1; lebih hemat tenaga</td><td>Gerobak dorong, pembuka botol, pemecah kemiri</td></tr><tr><td>III</td><td>Kuasa</td><td>Selalu &lt; 1; gerak lebih cepat / jangkauan luas</td><td>Pinset, sekop, pancing, sapu</td></tr></tbody></table></div> <div class=\"co w\">Jungkat-jungkit seimbang ketika berat × jarak poros sama di kedua sisi. Anak yang lebih berat perlu duduk lebih dekat poros.</div> <p>Contoh: anak A berat 300 N duduk 1,5 m dari poros; anak B berat 450 N. 300 × 1,5 = 450 × L₂, jadi L₂ = 1 m.</p> <div class=\"tw\"><table><thead><tr><th>Gerak tubuh</th><th>Tumpu</th><th>Kuasa</th><th>Beban</th><th>Golongan</th></tr></thead><tbody><tr><td>Kepala mengangguk</td><td>Sendi leher</td><td>Otot leher belakang</td><td>Berat kepala</td><td>I</td></tr><tr><td>Kaki berjinjit</td><td>Ujung jari kaki</td><td>Otot betis</td><td>Berat badan</td><td>II</td></tr><tr><td>Lengan mengangkat beban</td><td>Sendi siku</td><td>Otot bisep</td><td>Beban di tangan</td><td>III</td></tr></tbody></table></div>"}, [3, "Coba sendiri · tuas tubuh", "Pinset termasuk tuas golongan berapa? Pilih jawaban yang tepat.", "Golongan III: kuasa (jari yang menekan) berada di tengah, antara tumpu (pangkal pinset) dan beban (ujung pinset).", ["Golongan I — tumpu di tengah", "Golongan II — beban di tengah", "Golongan III — kuasa di tengah"], "Golongan III — kuasa di tengah"], [3, "Coba sendiri · jungkat-jungkit", "Anak A memiliki berat 300 N dan duduk 1,5 m dari poros. Anak B beratnya 450 N. Berapa meter dari poros B harus duduk agar seimbang? Masukkan angka.", "Gunakan w₁ × L₁ = w₂ × L₂. 300 × 1,5 = 450 × L₂, sehingga L₂ = 1 m.", null, null, 1, "m"], {"c": 3, "t": "Katrol · mengubah arah dan besar gaya", "i": "Katrol adalah roda beralur yang dilewati tali atau rantai. Banyak tali penopang beban menentukan keuntungan mekanik ideal.", "b": "<div class=\"tw\"><table><thead><tr><th>Jenis</th><th>Ciri</th><th>KM</th><th>Fungsi / contoh</th></tr></thead><tbody><tr><td>Tetap</td><td>Poros tidak bergerak</td><td>1</td><td>Mengubah arah gaya; tiang bendera, sumur timba.</td></tr><tr><td>Bergerak</td><td>Poros ikut naik bersama beban</td><td>2</td><td>Gaya ideal menjadi setengah; pengangkat barang.</td></tr><tr><td>Majemuk / takal</td><td>Gabungan tetap dan bergerak</td><td>n = jumlah tali penopang</td><td>Mengurangi gaya; derek bangunan, pengangkat mesin.</td></tr></tbody></table></div> <div class=\"fm\">F = w ÷ KM · s tarik = KM × h<br><small>Gaya kecil berarti tali ditarik lebih jauh.</small></div> <div class=\"ex\"><div><b>1</b><span>Beban 600 N; katrol majemuk ditopang 3 tali.</span></div><div><b>2</b><span>KM = 3, maka F = 600 ÷ 3 = 200 N.</span></div><div><b>3</b><span>Untuk menaikkan beban 1 m, tali ditarik 3 × 1 = 3 m.</span></div></div>"}, [3, "Coba sendiri · katrol majemuk", "Katrol majemuk memiliki 4 tali penopang untuk beban 800 N. Berapa gaya tarik ideal yang dibutuhkan? Masukkan angka.", "KM = 4. Gaya tarik F = w ÷ KM = 800 ÷ 4 = 200 N.", null, null, 200, "N"], {"c": 3, "t": "Bidang miring, baji, dan sekrup", "i": "Bidang miring mengurangi gaya dengan memperpanjang lintasan. Permukaan lebih landai berarti gaya ideal yang dibutuhkan lebih kecil.", "b": "<div class=\"fm\">F × s = w × h · KM = s ÷ h<br><small>s = panjang bidang · h = tinggi</small></div> <div class=\"ex\"><div><b>1</b><span>Beban 500 N dinaikkan setinggi 1 m melalui papan 4 m.</span></div><div><b>2</b><span>F = (w × h) ÷ s = (500 × 1) ÷ 4 = 125 N.</span></div><div><b>3</b><span>KM = s ÷ h = 4 ÷ 1 = 4.</span></div></div> <div class=\"tw\"><table><thead><tr><th>Bentuk</th><th>Cara kerjanya</th><th>Contoh</th></tr></thead><tbody><tr><td>Bidang miring</td><td>Permukaan miring yang dilalui benda.</td><td>Tangga, jalan menanjak, papan truk, ramp kursi roda.</td></tr><tr><td>Baji</td><td>Dua bidang miring yang digabung.</td><td>Pisau, kapak, pahat, paku.</td></tr><tr><td>Sekrup</td><td>Bidang miring yang dililitkan pada batang.</td><td>Baut, tutup botol / toples, bor.</td></tr></tbody></table></div> <div class=\"co\">Jalan di pegunungan dibuat berkelok agar lintasannya lebih panjang dan tanjakannya lebih landai. Ini penerapan bidang miring.</div>"}, [3, "Coba sendiri · papan ke bak truk", "Papan sepanjang 3 m dipakai untuk menaikkan beban 400 N ke bak setinggi 0,6 m. Berapa gaya ideal yang dibutuhkan? Masukkan angka.", "F = (w × h) ÷ s = (400 × 0,6) ÷ 3 = 80 N. KM = s ÷ h = 3 ÷ 0,6 = 5.", null, null, 80, "N"], {"c": 3, "t": "Roda berporos", "i": "Roda besar menyatu dengan poros kecil. Ketika kuasa diberikan pada roda besar, gaya untuk memutar poros menjadi lebih kecil.", "b": "<div class=\"fm\">KM = R ÷ r<br><small>R = jari-jari roda · r = jari-jari poros</small></div> <div class=\"ex\"><div><b>1</b><span>Setir berjari-jari 20 cm; poros berjari-jari 2 cm; beban pada poros 50 N.</span></div><div><b>2</b><span>KM = R ÷ r = 20 ÷ 2 = 10.</span></div><div><b>3</b><span>Gaya pada setir F = w ÷ KM = 50 ÷ 10 = 5 N.</span></div></div> <p>Contoh lain: gagang pintu bulat, obeng (gagang adalah roda, mata obeng poros), keran air, dan engkol sumur.</p>"}, [3, "Coba sendiri · guna pesawat sederhana", "Benarkah pesawat sederhana mengurangi jumlah usaha yang dilakukan?", "Tidak. Pada keadaan ideal, usaha kuasa = usaha beban. Pesawat sederhana mengurangi gaya, mengubah arah, atau menukar gaya dengan jarak.", ["Ya, selalu mengurangi usaha", "Tidak, hanya mengubah gaya / arah / jarak"], "Tidak, hanya mengubah gaya / arah / jarak"], {"c": 4, "t": "Bekal akhir · rumus sakti", "i": "Simpan peta rumus ini. Periksa arti simbol dan satuan sebelum memasukkan angka.", "b": "<div class=\"tw\"><table><thead><tr><th>Topik</th><th>Rumus</th><th>Satuan / catatan</th></tr></thead><tbody><tr><td>Usaha</td><td>W = F × s</td><td>J; F dalam N dan s dalam m</td></tr><tr><td>Mengangkat</td><td>W = w × h = m × g × h</td><td>w = m × g dalam N</td></tr><tr><td>Daya</td><td>P = W ÷ t</td><td>Watt = J/s</td></tr><tr><td>Energi listrik</td><td>E = P × t</td><td>kWh jika P dalam kW dan t dalam jam</td></tr><tr><td>Potensial</td><td>Ep = m × g × h</td><td>J</td></tr><tr><td>Kinetik</td><td>Ek = ½ × m × v²</td><td>J</td></tr><tr><td>Mekanik</td><td>Em = Ep + Ek</td><td>Tetap tanpa gesekan</td></tr><tr><td>Jatuh bebas</td><td>v = √(2 × g × h)</td><td>m/s; tanpa hambatan udara</td></tr><tr><td>Efisiensi</td><td>η = (berguna ÷ masukan) × 100%</td><td>%</td></tr><tr><td>Tuas</td><td>w × Lb = F × Lk; KM = Lk ÷ Lb</td><td>Lb dan Lk satuan panjang sama</td></tr><tr><td>Katrol</td><td>F = w ÷ KM</td><td>KM = jumlah tali penopang; tetap 1, bergerak 2</td></tr><tr><td>Bidang miring</td><td>F × s = w × h; KM = s ÷ h</td><td>s panjang lintasan, h tinggi</td></tr><tr><td>Roda berporos</td><td>KM = R ÷ r</td><td>R roda, r poros</td></tr></tbody></table></div>"}, {"c": 4, "t": "Jebakan soal · berhenti sejenak", "i": "Kesalahan kecil sering muncul karena satuan atau makna besaran tertukar. Cek enam hal ini sebelum yakin.", "b": "<div class=\"tw\"><table><thead><tr><th>Jebakan</th><th>Pemeriksaan cepat</th></tr></thead><tbody><tr><td>Massa dianggap berat</td><td>Ubah dahulu: w = m × g. kg bukan N.</td></tr><tr><td>Satuan belum seragam</td><td>Ubah cm ke m, menit ke sekon, km/jam ke m/s sebelum menghitung.</td></tr><tr><td>Menahan benda dianggap usaha</td><td>Tanpa perpindahan, W = 0.</td></tr><tr><td>Pesawat sederhana dianggap mengurangi usaha</td><td>Yang berkurang bisa gaya; jarak bertambah (ideal).</td></tr><tr><td>Lupa kuadrat v atau ½</td><td>Tulis lengkap Ek = ½ × m × v².</td></tr><tr><td>Massa dianggap mengubah laju jatuh bebas ideal</td><td>Dalam v = √(2gh), massa tidak ada.</td></tr></tbody></table></div> <div class=\"co w\">Trik aman: tulis diketahui, ditanya, rumus, substitusi angka, lalu satuan. Untuk soal energi, gambarkan perubahan bentuknya.</div>"}, {"c": 4, "t": "Glosarium mini", "i": "Istilah penting dalam bahasa sederhana, supaya kamu bisa membaca soal dengan lebih percaya diri.", "b": "<div class=\"tw\"><table><thead><tr><th>Istilah</th><th>Arti sederhana</th></tr></thead><tbody><tr><td>Usaha</td><td>Kerja gaya yang memindahkan benda; W = F × s.</td></tr><tr><td>Daya</td><td>Seberapa cepat usaha dilakukan; P = W ÷ t.</td></tr><tr><td>Energi</td><td>Kemampuan untuk melakukan usaha.</td></tr><tr><td>Joule (J)</td><td>Satuan usaha dan energi.</td></tr><tr><td>Watt (W)</td><td>Satuan daya; 1 W = 1 J/s.</td></tr><tr><td>Energi potensial</td><td>Energi tersimpan karena posisi atau keadaan.</td></tr><tr><td>Energi kinetik</td><td>Energi yang dimiliki benda bergerak.</td></tr><tr><td>Energi mekanik</td><td>Jumlah energi potensial dan kinetik.</td></tr><tr><td>Kekekalan energi</td><td>Energi tidak hilang atau tercipta; hanya berubah bentuk.</td></tr><tr><td>Efisiensi</td><td>Persentase masukan yang menjadi energi berguna.</td></tr><tr><td>Pesawat sederhana</td><td>Alat yang memudahkan pekerjaan dengan mengubah gaya, arah, atau jarak.</td></tr><tr><td>Beban / kuasa</td><td>Gaya yang dilawan / gaya yang kita berikan.</td></tr><tr><td>Titik tumpu</td><td>Poros tempat tuas berputar.</td></tr><tr><td>Lengan beban / kuasa</td><td>Jarak dari tumpu ke beban / titik kuasa.</td></tr><tr><td>Keuntungan mekanik</td><td>Perbandingan w ÷ F; menunjukkan penguatan gaya.</td></tr></tbody></table></div>"}],BN0=['Awal ekspedisi','Bab 1 · Usaha','Bab 2 · Energi','Bab 3 · Pesawat Sederhana','Bekal akhir'];
let MQ=MQ0,BN=BN0,BAB=0;const MQ1=[{"c": 0, "t": "Selamat datang di ekspedisi Gelombang", "i": "Pengantar", "b": "<div class=\"tw\"><table><thead><tr><th>🎸 <strong>BAB 1 GETARAN</strong> Periode &amp; frekuensi Bandul &amp; pegas Resonansi</th><th>🔊 <strong>BAB 2 GELOMBANG &amp; BUNYI</strong> Transversal &amp; longitudinal v = λ × f Gema, sonar, telinga</th><th>🌈 <strong>BAB 3 CAHAYA</strong> Cermin &amp; lensa Pembiasan &amp; warna Pelangi</th><th>🔭 <strong>BAB 4 ALAT OPTIK</strong> Mata &amp; kacamata Kamera, lup Mikroskop &amp; teropong</th></tr></thead><tbody></tbody></table></div> <div class=\"co g\"><strong>🎯 SETELAH BELAJAR, KAMU BISA…</strong> menjelaskan <strong>getaran</strong> serta menghitung <strong>periode dan frekuensi</strong>, termasuk pada bandul; membedakan <strong>gelombang transversal dan longitudinal</strong>, dan memakai <strong>v = λ × f</strong>; menjelaskan sifat <strong>bunyi</strong> (nada, gema, resonansi, sonar) dan manfaatnya; menjelaskan <strong>pemantulan dan pembiasan cahaya</strong>, serta sifat bayangan pada <strong>cermin dan lensa</strong>; menjelaskan cara kerja <strong>mata, kamera, lup, mikroskop, dan teropong</strong>, termasuk kacamata untuk kelainan mata.</div> <div class=\"co w\"><strong>📌 CARA BELAJAR BIAR JOSS</strong> 1) Baca <strong>Peta Materi</strong> dulu.  2) Pahami rumus lewat gambar dan contoh.  3) Kerjakan <strong>Coba Sendiri</strong> tanpa mengintip jawaban.  4) Hafalkan <strong>Trik Ingat</strong>, lalu coba kegiatan <strong>Coba di Rumah</strong>. Materi ini melengkapi pembahasan <strong>Bank Soal IPA No. 20 (Getaran)</strong>, <strong>No. 24 (Alat Optik)</strong>, dan <strong>No. 28 (Gelombang Gempa)</strong> — contohnya kita bahas lagi di dalam.</div> <div class=\"fm\"><strong>🗺️  PETA MATERI</strong></div> <div class=\"co\"><strong>Dari Getaran sampai Alat Optik</strong> <em>Satu cerita besar yang saling nyambung</em></div> <div class=\"tw\"><table><thead><tr><th><strong>Getaran</strong> <strong>gerak bolak-balik</strong></th><th><strong>➜</strong></th><th><strong>Gelombang</strong> <strong>getaran yang merambat</strong></th><th><strong>➜</strong></th><th><strong>Bunyi &amp; Cahaya</strong> <strong>dua contoh gelombang</strong></th><th><strong>➜</strong></th><th><strong>Alat Optik</strong> <strong>memanfaatkan cahaya</strong></th></tr></thead><tbody></tbody></table></div> <p>Semuanya bermula dari <strong>getaran</strong>. Getaran yang merambat disebut <strong>gelombang</strong>. <strong>Bunyi</strong> adalah gelombang yang perlu medium, sedangkan <strong>cahaya</strong> adalah gelombang yang bisa menembus ruang hampa. Karena cahaya bisa dipantulkan dan dibiaskan, kita bisa membuat <strong>cermin, lensa, dan alat optik</strong> seperti kacamata, kamera, mikroskop, dan teropong.</p> <div class=\"co\"><strong>🧭 EMPAT PERTANYAAN BESAR YANG AKAN KITA JAWAB</strong> <strong>Bab 1 – Getaran:</strong> bagaimana mengukur kecepatan getaran, dan apa yang menentukan ayunan bandul? <strong>Bab 2 – Gelombang &amp; Bunyi:</strong> bagaimana getaran bisa merambat, dan mengapa ada gema serta nada tinggi-rendah? <strong>Bab 3 – Cahaya:</strong> bagaimana cahaya dipantulkan, dibiaskan, dan membentuk bayangan? <strong>Bab 4 – Alat Optik:</strong> bagaimana mata dan alat optik bekerja, dan mengapa ada kacamata minus atau plus?</div>"}, {"c": 1, "t": "1.1 Apa Itu Getaran?", "i": "Bab 1 · Getaran", "b": "<p><strong>Getaran adalah gerak bolak-balik suatu benda secara berulang melalui titik kesetimbangannya.</strong> Benda yang bergetar selalu \"ditarik kembali\" ke posisi setimbangnya, lalu melewatinya dan bergerak ke sisi lain.</p> <div class=\"tw\"><table><thead><tr><th><strong>Benda</strong></th><th><strong>Apa yang bergetar?</strong></th></tr></thead><tbody><tr><td><strong>Senar gitar dipetik</strong></td><td>senar bergerak naik-turun di sekitar posisi diamnya</td></tr><tr><td><strong>Bandul jam dan ayunan</strong></td><td>benda berayun ke kanan dan ke kiri</td></tr><tr><td><strong>Penggaris dijepit lalu disentil</strong></td><td>ujung penggaris naik-turun</td></tr><tr><td><strong>Pegas diberi beban lalu ditarik</strong></td><td>beban bergerak naik-turun</td></tr><tr><td><strong>Speaker dan garpu tala</strong></td><td>membran atau kaki garpu bergetar cepat, menghasilkan bunyi</td></tr></tbody></table></div>"}, {"c": 1, "t": "1.2 Istilah Penting dalam Getaran", "i": "Bab 1 · Getaran", "b": "<div class=\"tw\"><table><thead><tr><th><strong>Istilah</strong></th><th><strong>Artinya</strong></th><th><strong>Satuan</strong></th></tr></thead><tbody><tr><td><strong>Titik setimbang (O)</strong></td><td>posisi benda saat diam, sebelum digetarkan</td><td>—</td></tr><tr><td><strong>Simpangan</strong></td><td>jarak benda dari titik setimbang pada saat tertentu</td><td>meter (m)</td></tr><tr><td><strong>Amplitudo (A)</strong></td><td>simpangan terbesar (jarak titik setimbang ke ujung gerakan)</td><td>meter (m)</td></tr><tr><td><strong>Satu getaran</strong></td><td>gerak penuh sampai kembali ke titik awal dengan arah yang sama, misalnya O → B → O → A → O</td><td>—</td></tr><tr><td><strong>Periode (T)</strong></td><td>waktu yang diperlukan untuk <strong>1 getaran</strong></td><td>sekon (s)</td></tr><tr><td><strong>Frekuensi (f)</strong></td><td>banyak getaran dalam <strong>1 sekon</strong></td><td>hertz (Hz)</td></tr></tbody></table></div> <div class=\"co w\"><strong>⚠️ AWAS SALAH KAPRAH!</strong> <strong>Satu getaran bukan hanya dari A ke B!</strong> Perjalanan A → O → B baru <strong>setengah</strong> getaran. Satu getaran penuh adalah A → O → B → O → A.</div>"}, {"c": 1, "t": "1.3 Periode dan Frekuensi", "i": "Bab 1 · Getaran", "b": "<p>Periode dan frekuensi adalah dua cara menyatakan \"seberapa cepat\" benda bergetar. Keduanya <strong>saling berkebalikan</strong>.</p> <div class=\"fm\"><strong>T = t ÷ n        f = n ÷ t</strong></div> <div class=\"fm\"><strong>f = 1 ÷ T        T = 1 ÷ f</strong></div> <div class=\"tw\"><table><thead><tr><th><strong>Simbol</strong></th><th><strong>Arti</strong></th><th><strong>Satuan</strong></th></tr></thead><tbody><tr><td><strong>n</strong></td><td>banyak getaran</td><td>kali (tanpa satuan)</td></tr><tr><td><strong>t</strong></td><td>waktu total getaran</td><td>sekon (s)</td></tr><tr><td><strong>T</strong></td><td>periode</td><td>sekon (s)</td></tr><tr><td><strong>f</strong></td><td>frekuensi</td><td>hertz (Hz), 1 Hz = 1 getaran per sekon</td></tr></tbody></table></div> <div class=\"co\"><strong>✏️ CONTOH SOAL</strong> Sebuah bandul melakukan <strong>20 getaran</strong> dalam waktu <strong>10 sekon</strong>. Tentukan periode dan frekuensinya!&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; Diketahui: n = 20, t = 10 s. Ditanya: T dan f.&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; Periode: T = t ÷ n = 10 ÷ 20 = <strong>0,5 s</strong>&lt;br&gt;&lt;strong&gt;3.&lt;/strong&gt; Frekuensi: f = n ÷ t = 20 ÷ 10 = <strong>2 Hz</strong> (cek: 1 ÷ 0,5 = 2 ✔)</div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Garpu tala</strong> Garpu tala bernada la bergetar dengan frekuensi <strong>440 Hz</strong>. Berapa periodenya?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; T = 1 ÷ f = 1 ÷ 440&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; T ≈ <strong>0,0023 s</strong> (sekitar 2,3 milisekon). Getarannya sangat cepat!</div> <div class=\"co w\"><strong>🤔 TAHUKAH KAMU?</strong> Satuan <strong>hertz (Hz)</strong> dinamai dari fisikawan Jerman, Heinrich Hertz. Detak jantung 72 kali per menit berarti 72 ÷ 60 = <strong>1,2 Hz</strong>. Jam tangan kuarsa memakai kristal yang bergetar <strong>32.768 kali per sekon</strong> untuk menghitung waktu dengan sangat teliti.</div> <div class=\"co g\"><strong>🎯 TRIK INGAT</strong> <strong>T dan f saling kebalikan:</strong> periode besar → frekuensi kecil (getaran lambat), periode kecil → frekuensi besar (getaran cepat). Satuan kelipatan: 1 kHz = 1.000 Hz, 1 MHz = 1.000.000 Hz (frekuensi radio FM memakai MHz).</div>"}, {"c": 1, "t": "1.4 Bandul Sederhana dan Pegas (pembahasan Bank Soal No. 20)", "i": "Bab 1 · Getaran", "b": "<p>Bandul sederhana adalah beban yang digantung pada tali ringan lalu diayunkan dengan simpangan kecil. Periodenya bergantung pada <strong>panjang tali (l)</strong> dan <strong>percepatan gravitasi (g)</strong>:</p> <div class=\"fm\"><strong>T = 2π √(l ÷ g)</strong></div> <div class=\"tw\"><table><thead><tr><th><strong>Faktor</strong></th><th><strong>Memengaruhi periode bandul?</strong></th><th><strong>Penjelasan</strong></th></tr></thead><tbody><tr><td><strong>Panjang tali (l)</strong></td><td><strong>✔ Ya</strong></td><td>Makin panjang tali, makin lambat ayunan (periode makin besar).</td></tr><tr><td><strong>Percepatan gravitasi (g)</strong></td><td><strong>✔ Ya</strong></td><td>Makin besar gravitasi, makin cepat ayunan.</td></tr><tr><td><strong>Massa beban</strong></td><td><strong>✘ Tidak</strong></td><td>Beban berat atau ringan berayun dengan ritme yang sama.</td></tr><tr><td><strong>Amplitudo (simpangan kecil)</strong></td><td><strong>✘ Tidak</strong></td><td>Selama sudut simpangan kecil, periodenya hampir sama.</td></tr></tbody></table></div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Soal No. 20</strong> Bandul P bertali <strong>25 cm</strong> dan bandul Q bertali <strong>100 cm</strong> diayunkan di tempat yang sama. Bandingkan periode dan frekuensinya!&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; Perbandingan panjang tali: l_Q ÷ l_P = 100 ÷ 25 = 4 kali&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; Periode berbanding lurus dengan <strong>akar</strong> panjang tali: √4 = 2&lt;br&gt;&lt;strong&gt;3.&lt;/strong&gt; Jadi periode Q = <strong>2 × periode P</strong> (Q lebih lambat). Dengan g = 10 m/s², T_P ≈ 1 s dan T_Q ≈ 2 s&lt;br&gt;&lt;strong&gt;4.&lt;/strong&gt; Frekuensi f = 1 ÷ T, sehingga frekuensi Q = <strong>½ × frekuensi P</strong> (frekuensi P lebih besar)&lt;br&gt;&lt;strong&gt;5.&lt;/strong&gt; Massa beban tidak ikut menentukan periode bandul</div> <div class=\"co w\"><strong>⚠️ AWAS SALAH KAPRAH!</strong> <strong>Pada bandul, massa tidak berpengaruh. Pada pegas, massa berpengaruh!</strong> Untuk beban di ujung pegas: beban yang lebih berat membuat getaran <strong>lebih lambat</strong>, sedangkan pegas yang lebih kaku membuat getaran <strong>lebih cepat</strong> (T = 2π√(m ÷ k)). Jangan tertukar!</div> <div class=\"co g\"><strong>🎯 TRIK INGAT</strong> Bayangkan ayunan di taman: rantai panjang → ayunan pelan, rantai pendek → ayunan cepat. Berat anak yang duduk tidak mengubah ritme ayunannya.</div> <div class=\"co w\"><strong>🤔 TAHUKAH KAMU?</strong> Jam bandul tua memakai bandul sepanjang sekitar <strong>1 meter</strong> yang periodenya ±2 sekon, sehingga satu ayunan ke satu arah memakan waktu ±1 sekon. Ayunan yang teratur itulah yang membuatnya menjadi pengukur waktu.</div>"}, {"c": 1, "t": "1.5 Getaran di Sekitar Kita", "i": "Bab 1 · Getaran", "b": "<div class=\"tw\"><table><thead><tr><th><strong>Contoh</strong></th><th><strong>Peran getaran</strong></th></tr></thead><tbody><tr><td><strong>Alat musik (gitar, drum, seruling)</strong></td><td>getaran senar, membran, atau udara menghasilkan bunyi</td></tr><tr><td><strong>Speaker dan telepon genggam</strong></td><td>membran bergetar menghasilkan suara</td></tr><tr><td><strong>Pegas pada kendaraan (peredam kejut)</strong></td><td>meredam getaran agar perjalanan nyaman</td></tr><tr><td><strong>Gempa bumi</strong></td><td>getaran tanah merambat sebagai gelombang gempa</td></tr><tr><td><strong>Jam bandul dan jam kuarsa</strong></td><td>getaran teratur dipakai mengukur waktu</td></tr></tbody></table></div> <div class=\"co w\"><strong>🔬 COBA DI RUMAH</strong> Buat bandul dari benang dan sebuah mur atau baut. Hitung waktu <strong>20 ayunan</strong> dengan stopwatch HP, lalu bagi 20 untuk mendapat T. Ulangi dengan benang <strong>4 kali lebih panjang</strong>. Apakah periodenya menjadi <strong>2 kali</strong> lebih besar? Coba juga mengganti beban dengan yang lebih berat.</div>"}, {"c": 1, "t": "Coba sendiri · Soal 1", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Sebuah ayunan melakukan 30 getaran dalam 15 sekon. Berapa periode dan frekuensinya?", "a": "T = 15 ÷ 30 = <strong>0,5 s</strong> dan f = 30 ÷ 15 = <strong>2 Hz</strong>"}, {"c": 1, "t": "Coba sendiri · Soal 2", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Sumber getar berfrekuensi 4 Hz bergetar selama 10 sekon. Berapa banyak getarannya, dan berapa periodenya?", "a": "n = f × t = 4 × 10 = <strong>40 getaran</strong>; T = 1 ÷ 4 = <strong>0,25 s</strong>"}, {"c": 1, "t": "Coba sendiri · Soal 3", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Bandul A bertali 1 m dan bandul B bertali 4 m. Berapa perbandingan periode B terhadap A?", "a": "√(4 ÷ 1) = 2, jadi periode B = <strong>2 × periode A</strong>"}, {"c": 1, "t": "Coba sendiri · Soal 4", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Benarkah bandul yang lebih berat berayun lebih lambat?", "a": "<strong>Tidak.</strong> Massa beban tidak memengaruhi periode bandul sederhana."}, {"c": 2, "t": "2.1 Apa Itu Gelombang?", "i": "Bab 2 · Gelombang & Bunyi", "b": "<p><strong>Gelombang adalah getaran yang merambat.</strong> Ketika sumber bergetar, getarannya diteruskan ke bagian di sekitarnya, lalu ke bagian berikutnya, sehingga gangguan itu \"berjalan\" menjauhi sumber.</p> <div class=\"co\"><strong>🌊 KUNCI PENTING</strong> Gelombang <strong>memindahkan energi</strong>, bukan memindahkan materi (zat). Daun yang mengapung di air hanya <strong>naik-turun di tempatnya</strong> ketika gelombang lewat; daun itu tidak ikut terbawa jauh oleh gelombangnya.</div> <div class=\"tw\"><table><thead><tr><th><strong>Aspek</strong></th><th><strong>Gelombang mekanik</strong></th><th><strong>Gelombang elektromagnetik</strong></th></tr></thead><tbody><tr><td><strong>Perlu medium?</strong></td><td><strong>✔ Ya</strong> — butuh zat perantara</td><td><strong>✘ Tidak</strong> — bisa merambat di ruang hampa</td></tr><tr><td><strong>Contoh</strong></td><td>bunyi, gelombang tali, gelombang air, gelombang gempa</td><td>cahaya, gelombang radio, gelombang mikro, sinar-X</td></tr><tr><td><strong>Cepat rambat</strong></td><td>bergantung pada mediumnya</td><td>3 × 10⁸ m/s di ruang hampa</td></tr></tbody></table></div>"}, {"c": 2, "t": "2.2 Gelombang Transversal dan Longitudinal", "i": "Bab 2 · Gelombang & Bunyi", "b": "<p>Gelombang dibedakan berdasarkan <strong>arah getar</strong> partikel terhadap <strong>arah rambat</strong> gelombang.</p> <div class=\"tw\"><table><thead><tr><th></th><th><strong>Transversal</strong></th><th><strong>Longitudinal</strong></th></tr></thead><tbody><tr><td><strong>Arah getar</strong></td><td>tegak lurus arah rambat</td><td>sejajar arah rambat</td></tr><tr><td><strong>Bagian gelombang</strong></td><td>puncak (bukit) dan lembah</td><td>rapatan dan renggangan</td></tr><tr><td><strong>Satu gelombang</strong></td><td>satu bukit + satu lembah</td><td>satu rapatan + satu renggangan</td></tr><tr><td><strong>Contoh</strong></td><td>gelombang pada tali, cahaya, gelombang S gempa</td><td>bunyi, pegas slinki yang didorong-tarik, gelombang P gempa</td></tr></tbody></table></div> <div class=\"co g\"><strong>🎯 TRIK INGAT</strong> <strong>T</strong>ransversal = <strong>T</strong>egak lurus (sama-sama berawalan T). <strong>L</strong>ongitudinal = <strong>L</strong>urus sejajar (sama-sama berawalan L).</div>"}, {"c": 2, "t": "2.3 Besaran-Besaran Gelombang", "i": "Bab 2 · Gelombang & Bunyi", "b": "<div class=\"tw\"><table><thead><tr><th><strong>Besaran</strong></th><th><strong>Simbol</strong></th><th><strong>Artinya</strong></th><th><strong>Satuan</strong></th></tr></thead><tbody><tr><td><strong>Panjang gelombang</strong></td><td>λ (lambda)</td><td>jarak satu gelombang penuh (puncak ke puncak atau rapatan ke rapatan)</td><td>m</td></tr><tr><td><strong>Amplitudo</strong></td><td>A</td><td>simpangan terbesar dari garis setimbang</td><td>m</td></tr><tr><td><strong>Periode</strong></td><td>T</td><td>waktu untuk satu gelombang</td><td>s</td></tr><tr><td><strong>Frekuensi</strong></td><td>f</td><td>banyak gelombang tiap sekon</td><td>Hz</td></tr><tr><td><strong>Cepat rambat</strong></td><td>v</td><td>jarak yang ditempuh gelombang tiap sekon</td><td>m/s</td></tr></tbody></table></div> <div class=\"fm\"><strong>v = λ × f = λ ÷ T</strong></div> <div class=\"fm\"><strong>v</strong></div> <div class=\"fm\"><strong>λ</strong></div> <p>Tutup besaran yang dicari: tutup <strong>v</strong> → λ × f  •  tutup <strong>λ</strong> → v ÷ f  •  tutup <strong>f</strong> → v ÷ λ</p> <div class=\"co\"><strong>✏️ CONTOH SOAL — Gelombang tali</strong> Gelombang pada tali memiliki panjang gelombang <strong>2 m</strong> dan frekuensi <strong>5 Hz</strong>. Berapa cepat rambatnya?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; Diketahui: λ = 2 m, f = 5 Hz. Ditanya: v.&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; v = λ × f = 2 × 5 = <strong>10 m/s</strong></div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Gelombang air</strong> Jarak dua puncak gelombang air yang berurutan <strong>50 cm</strong>. Dalam <strong>4 sekon</strong> lewat <strong>8 gelombang</strong>. Berapa cepat rambat gelombang?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; λ = 50 cm = 0,5 m&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; Frekuensi: f = n ÷ t = 8 ÷ 4 = 2 Hz&lt;br&gt;&lt;strong&gt;3.&lt;/strong&gt; Cepat rambat: v = λ × f = 0,5 × 2 = <strong>1 m/s</strong></div> <div class=\"co w\"><strong>⚠️ AWAS SALAH KAPRAH!</strong> <strong>Panjang gelombang (λ) bukan tinggi gelombang!</strong> λ diukur <strong>mendatar</strong> sepanjang arah rambat, sedangkan tinggi diukur <strong>tegak</strong> (itu amplitudo). Ubah cm ke m sebelum menghitung.</div> <div class=\"co w\"><strong>🤔 TAHUKAH KAMU?</strong> Saat gelombang berpindah ke medium lain, <strong>frekuensinya tetap</strong> (ditentukan oleh sumber), tetapi <strong>cepat rambat dan panjang gelombangnya berubah</strong>. Itulah sebabnya suara terdengar berbeda ketika kamu menyelam.</div>"}, {"c": 2, "t": "2.4 Sifat-Sifat Gelombang", "i": "Bab 2 · Gelombang & Bunyi", "b": "<div class=\"tw\"><table><thead><tr><th><strong>Sifat</strong></th><th><strong>Artinya</strong></th><th><strong>Contoh dalam kehidupan</strong></th></tr></thead><tbody><tr><td><strong>Pemantulan (refleksi)</strong></td><td>gelombang memantul ketika mengenai penghalang</td><td>gema di tebing, pantulan gelombang air di dinding kolam</td></tr><tr><td><strong>Pembiasan (refraksi)</strong></td><td>gelombang membelok saat berpindah medium</td><td>gelombang laut membelok mendekati pantai yang dangkal</td></tr><tr><td><strong>Difraksi (lenturan)</strong></td><td>gelombang melewati celah atau tepi lalu menyebar</td><td>suara orang terdengar dari balik tembok atau tikungan</td></tr><tr><td><strong>Interferensi</strong></td><td>dua gelombang bertemu lalu saling memperkuat atau melemahkan</td><td>headphone peredam bising (noise cancelling)</td></tr></tbody></table></div>"}, {"c": 2, "t": "2.5 Bunyi", "i": "Bab 2 · Gelombang & Bunyi", "b": "<p><strong>Bunyi adalah gelombang longitudinal yang dihasilkan oleh benda yang bergetar</strong> dan merambat melalui medium (padat, cair, atau gas). Telinga menangkap rapatan dan renggangan udara itu sebagai bunyi.</p> <div class=\"co\"><strong>🚀 BUNYI TIDAK BISA MERAMBAT DI RUANG HAMPA</strong> Bunyi butuh medium. Lonceng listrik di dalam toples yang udaranya dipompa keluar tidak terdengar bunyinya. Karena itulah di luar angkasa <strong>tidak ada suara</strong>, tetapi cahaya Matahari tetap sampai ke Bumi.</div> <h3>Cepat rambat bunyi</h3> <div class=\"tw\"><table><thead><tr><th><strong>Medium</strong></th><th><strong>Cepat rambat bunyi (±)</strong></th></tr></thead><tbody><tr><td><strong>Udara</strong></td><td>340 m/s</td></tr><tr><td><strong>Air</strong></td><td>1.500 m/s</td></tr><tr><td><strong>Besi / baja</strong></td><td>5.000 m/s</td></tr><tr><td><strong>Ruang hampa</strong></td><td>tidak merambat</td></tr></tbody></table></div> <p>Pada umumnya bunyi merambat paling cepat di zat <strong>padat</strong>, lalu <strong>cair</strong>, lalu <strong>gas</strong>, karena partikel zat padat lebih rapat sehingga getaran lebih cepat diteruskan. Di udara, makin tinggi suhu, makin cepat bunyi merambat.</p> <h3>Nada, kerasnya bunyi, dan warna bunyi</h3> <div class=\"tw\"><table><thead><tr><th><strong>Ciri bunyi</strong></th><th><strong>Ditentukan oleh</strong></th><th><strong>Contoh</strong></th></tr></thead><tbody><tr><td><strong>Tinggi-rendah nada</strong></td><td><strong>frekuensi</strong> (makin besar f, makin tinggi nada)</td><td>senar yang pendek, tegang, atau tipis menghasilkan nada lebih tinggi</td></tr><tr><td><strong>Kuat-lemah (keras)</strong></td><td><strong>amplitudo</strong> (makin besar A, makin keras)</td><td>memetik senar lebih kuat membuat bunyi lebih keras</td></tr><tr><td><strong>Warna bunyi (timbre)</strong></td><td><strong>bentuk gelombang</strong> dari sumbernya</td><td>piano dan gitar memainkan nada sama, tetapi terdengar berbeda</td></tr></tbody></table></div> <h3>Tiga daerah frekuensi bunyi</h3> <div class=\"tw\"><table><thead><tr><th><strong>Daerah</strong></th><th><strong>Frekuensi</strong></th><th><strong>Keterangan</strong></th></tr></thead><tbody><tr><td><strong>Infrasonik</strong></td><td>di bawah 20 Hz</td><td>tidak terdengar manusia; gajah memakainya untuk berkomunikasi jarak jauh, juga dihasilkan gempa</td></tr><tr><td><strong>Audiosonik</strong></td><td>20 Hz – 20.000 Hz</td><td>daerah pendengaran manusia</td></tr><tr><td><strong>Ultrasonik</strong></td><td>di atas 20.000 Hz</td><td>tidak terdengar manusia; dipakai kelelawar, lumba-lumba, sonar, dan USG</td></tr></tbody></table></div> <h3>Pemantulan bunyi: gema, dengung, dan sonar</h3> <p>Bunyi yang mengenai penghalang dapat dipantulkan. Jika bunyi pantul terdengar <strong>terpisah</strong> setelah bunyi asli, itu disebut <strong>gema</strong>. Jika bunyi pantul datang <strong>hampir bersamaan</strong> sehingga bunyi asli terdengar bergaung, itu disebut <strong>gaung (dengung)</strong>.</p> <div class=\"co\"><strong>📏 JARAK DARI BUNYI PANTUL</strong> Bunyi pergi <strong>dan</strong> pulang, sehingga jarak ke penghalang adalah <strong>setengah</strong> dari jarak tempuh bunyi: <strong>s = (v × t) ÷ 2</strong> Gema baru terdengar jelas jika selang waktunya lebih dari 0,1 s, yaitu jarak penghalang minimal sekitar (340 × 0,1) ÷ 2 = <strong>17 m</strong>.</div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Sonar kapal</strong> Kapal memancarkan bunyi ultrasonik ke dasar laut. Pantulannya diterima setelah <strong>0,4 s</strong>. Jika cepat rambat bunyi di air laut <strong>1.500 m/s</strong>, berapa kedalaman laut?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; Diketahui: t = 0,4 s, v = 1.500 m/s.&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; Bunyi pergi-pulang: s = (v × t) ÷ 2&lt;br&gt;&lt;strong&gt;3.&lt;/strong&gt; s = (1.500 × 0,4) ÷ 2 = 600 ÷ 2 = <strong>300 m</strong></div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Petir</strong> Kilat terlihat, lalu <strong>3 sekon</strong> kemudian guntur terdengar. Jika v = 340 m/s, berapa jauh petir dari kamu?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; Cahaya kilat sampai hampir seketika, jadi waktu 3 s adalah waktu tempuh bunyi (searah, bukan pergi-pulang).&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; s = v × t = 340 × 3 = <strong>1.020 m</strong> (sekitar 1 km)</div> <h3>Resonansi</h3> <p><strong>Resonansi</strong> adalah peristiwa ikut bergetarnya suatu benda karena ada getaran lain yang <strong>berfrekuensi sama</strong> dengan frekuensi alaminya. Hasilnya, getaran menjadi besar dan bunyi terdengar lebih keras.</p> <div class=\"tw\"><table><thead><tr><th><strong>Contoh resonansi</strong></th><th><strong>Penjelasan</strong></th></tr></thead><tbody><tr><td><strong>Garpu tala di atas kotak kayu</strong></td><td>kotak ikut bergetar sehingga bunyi lebih nyaring</td></tr><tr><td><strong>Botol ditiup di bibirnya</strong></td><td>kolom udara di dalam botol beresonansi dan berbunyi</td></tr><tr><td><strong>Badan gitar akustik dan biola</strong></td><td>rongga badan beresonansi dan menguatkan bunyi senar</td></tr><tr><td><strong>Mendorong ayunan tepat sesuai ritmenya</strong></td><td>dorongan kecil berulang membuat ayunan makin tinggi</td></tr></tbody></table></div> <h3>Kebisingan dan kesehatan telinga</h3> <div class=\"tw\"><table><thead><tr><th><strong>Sumber bunyi</strong></th><th><strong>Tingkat kebisingan (±)</strong></th></tr></thead><tbody><tr><td><strong>Bisikan</strong></td><td>30 dB</td></tr><tr><td><strong>Percakapan biasa</strong></td><td>60 dB</td></tr><tr><td><strong>Jalan raya ramai</strong></td><td>80 dB</td></tr><tr><td><strong>Konser atau klakson sangat dekat</strong></td><td>100 – 110 dB</td></tr><tr><td><strong>Ambang rasa sakit</strong></td><td>120 dB</td></tr></tbody></table></div> <p>Bunyi di atas sekitar <strong>85 dB</strong> yang terus-menerus dalam waktu lama dapat merusak pendengaran. Kecilkan volume earphone dan istirahatkan telinga.</p> <h3>Perjalanan bunyi menuju otak</h3> <div class=\"tw\"><table><thead><tr><th><strong>Daun telinga</strong> <strong>menangkap bunyi</strong></th><th><strong>➜</strong></th><th><strong>Gendang telinga</strong> <strong>bergetar</strong></th><th><strong>➜</strong></th><th><strong>Tulang pendengaran</strong> <strong>martil, landasan, sanggurdi</strong></th><th><strong>➜</strong></th><th><strong>Koklea</strong> <strong>getaran → sinyal saraf</strong></th><th><strong>➜</strong></th><th><strong>Saraf → otak</strong> <strong>bunyi dikenali</strong></th></tr></thead><tbody></tbody></table></div> <div class=\"co w\"><strong>🤔 TAHUKAH KAMU?</strong> Kelelawar menemukan mangsa dengan <strong>ekolokasi</strong>: ia memancarkan bunyi ultrasonik dan mendengarkan pantulannya. Prinsip ini sama dengan <strong>sonar</strong> pada kapal dan <strong>USG</strong> untuk memeriksa janin.</div>"}, {"c": 2, "t": "2.6 Gelombang Gempa (pembahasan Bank Soal No. 28)", "i": "Bab 2 · Gelombang & Bunyi", "b": "<p>Gempa bumi mengirim gelombang ke seluruh Bumi. Dua jenis yang utama:</p> <div class=\"tw\"><table><thead><tr><th><strong>Gelombang</strong></th><th><strong>Jenis</strong></th><th><strong>Merambat melalui</strong></th><th><strong>Kecepatan</strong></th></tr></thead><tbody><tr><td><strong>P (primer)</strong></td><td>longitudinal</td><td><strong>padat, cair, dan gas</strong></td><td>lebih cepat, tiba lebih dulu</td></tr><tr><td><strong>S (sekunder)</strong></td><td>transversal</td><td><strong>hanya zat padat</strong></td><td>lebih lambat, tiba kemudian</td></tr></tbody></table></div> <p>Inti luar Bumi berwujud <strong>cair</strong>, sehingga <strong>gelombang S berhenti di inti luar</strong> (jawaban Soal No. 28). Dari fakta inilah ilmuwan mengetahui bahwa inti luar Bumi cair.</p> <div class=\"co g\"><strong>🎯 TRIK INGAT</strong> <strong>S = Solid only</strong> (hanya padat). <strong>P</strong> boleh lewat semua wujud zat.</div> <div class=\"co w\"><strong>🔬 COBA DI RUMAH</strong> Gunakan <strong>slinki</strong> atau pegas panjang. Dorong-tarik ujungnya untuk membuat gelombang <strong>longitudinal</strong>, lalu goyangkan ke kiri-kanan untuk membuat gelombang <strong>transversal</strong>. Tiup bibir botol kaca dengan isi air yang berbeda: botol dengan lebih banyak air menghasilkan nada <strong>lebih tinggi</strong> karena kolom udaranya lebih pendek.</div>"}, {"c": 2, "t": "Coba sendiri · Soal 1", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Gelombang dengan panjang gelombang 0,5 m dan frekuensi 20 Hz. Berapa cepat rambatnya?", "a": "v = λ × f = 0,5 × 20 = <strong>10 m/s</strong>"}, {"c": 2, "t": "Coba sendiri · Soal 2", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Guntur terdengar 4 s setelah kilat terlihat (v = 340 m/s). Berapa jarak petir?", "a": "s = v × t = 340 × 4 = <strong>1.360 m</strong>"}, {"c": 2, "t": "Coba sendiri · Soal 3", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Sonar menerima pantulan setelah 0,6 s di air (v = 1.500 m/s). Berapa kedalamannya?", "a": "s = (1.500 × 0,6) ÷ 2 = <strong>450 m</strong>"}, {"c": 2, "t": "Coba sendiri · Soal 4", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Termasuk gelombang apakah bunyi, transversal atau longitudinal? Dapatkah ia merambat di ruang hampa?", "a": "<strong>Longitudinal.</strong> <strong>Tidak</strong> dapat merambat di ruang hampa karena butuh medium."}, {"c": 3, "t": "3.1 Sifat-Sifat Cahaya", "i": "Bab 3 · Cahaya", "b": "<p><strong>Cahaya adalah gelombang elektromagnetik</strong> yang dapat dilihat mata. Ia berasal dari <strong>sumber cahaya</strong> (Matahari, lampu, api) dan kita melihat benda lain karena benda itu <strong>memantulkan</strong> cahaya ke mata kita.</p> <div class=\"tw\"><table><thead><tr><th><strong>Sifat cahaya</strong></th><th><strong>Buktinya</strong></th></tr></thead><tbody><tr><td><strong>Merambat lurus</strong></td><td>bayangan benda tajam; sinar senter di ruangan berdebu tampak lurus</td></tr><tr><td><strong>Tidak butuh medium</strong></td><td>cahaya Matahari menembus ruang hampa dan sampai ke Bumi</td></tr><tr><td><strong>Sangat cepat</strong></td><td>3 × 10⁸ m/s (300.000 km/s) di ruang hampa</td></tr><tr><td><strong>Dapat dipantulkan</strong></td><td>cermin, permukaan air yang tenang</td></tr><tr><td><strong>Dapat dibiaskan</strong></td><td>sedotan tampak patah di dalam gelas, kolam tampak dangkal</td></tr><tr><td><strong>Dapat diuraikan (dispersi)</strong></td><td>pelangi, prisma menguraikan cahaya putih</td></tr><tr><td><strong>Gelombang transversal</strong></td><td>dapat dipolarisasi (dipakai pada kacamata hitam polaroid)</td></tr></tbody></table></div> <div class=\"co w\"><strong>🤔 TAHUKAH KAMU?</strong> Cahaya Matahari memerlukan waktu sekitar <strong>8 menit 20 detik</strong> untuk sampai ke Bumi (500 sekon), dan cahaya Bulan hanya sekitar <strong>1,3 sekon</strong>. Cahaya jauh lebih cepat dari bunyi: sekitar <strong>900 ribu kali</strong> lebih cepat, itulah sebabnya kilat terlihat lebih dulu daripada guntur terdengar.</div> <h3>Bagaimana benda menanggapi cahaya?</h3> <div class=\"tw\"><table><thead><tr><th><strong>Jenis benda</strong></th><th><strong>Sifat</strong></th><th><strong>Contoh</strong></th></tr></thead><tbody><tr><td><strong>Bening (transparan)</strong></td><td>meneruskan hampir semua cahaya, benda di baliknya tampak jelas</td><td>kaca bening, air jernih, udara</td></tr><tr><td><strong>Tembus cahaya (translusen)</strong></td><td>meneruskan sebagian cahaya, benda di baliknya tampak buram</td><td>kertas minyak, kaca susu, plastik buram</td></tr><tr><td><strong>Gelap (opak)</strong></td><td>tidak meneruskan cahaya</td><td>kayu, besi, tembok, buku</td></tr></tbody></table></div> <div class=\"co w\"><strong>🤔 TAHUKAH KAMU?</strong> <strong>Gerhana Matahari</strong> terjadi saat Bulan berada di antara Matahari dan Bumi (bayangan Bulan jatuh ke Bumi). <strong>Gerhana Bulan</strong> terjadi saat Bumi berada di antara Matahari dan Bulan. Keduanya tidak terjadi setiap bulan karena bidang edar Bulan sedikit miring terhadap bidang edar Bumi.</div>"}, {"c": 3, "t": "3.2 Pemantulan Cahaya dan Cermin Datar", "i": "Bab 3 · Cahaya", "b": "<div class=\"co\"><strong>📜 HUKUM PEMANTULAN CAHAYA</strong> <strong>1.</strong> Sinar datang, sinar pantul, dan garis normal berada pada <strong>satu bidang</strong>. <strong>2.</strong> Besar <strong>sudut datang (i) = sudut pantul (r)</strong>.</div> <div class=\"tw\"><table><thead><tr><th><strong>Jenis pemantulan</strong></th><th><strong>Permukaan</strong></th><th><strong>Akibat</strong></th></tr></thead><tbody><tr><td><strong>Teratur</strong></td><td>rata dan halus (cermin, air tenang)</td><td>sinar pantul sejajar; terbentuk bayangan jelas</td></tr><tr><td><strong>Baur (difus)</strong></td><td>kasar (dinding, kertas, kain)</td><td>sinar pantul menyebar ke segala arah; kita bisa melihat benda dari berbagai sudut</td></tr></tbody></table></div> <h3>Sifat bayangan pada cermin datar</h3> <div class=\"co\"><strong>🪞 CERMIN DATAR</strong> Bayangan <strong>maya</strong> (tidak dapat ditangkap layar, berada di belakang cermin). <strong>Tegak</strong> dan <strong>sama besar</strong> dengan bendanya. Jarak bayangan ke cermin <strong>sama</strong> dengan jarak benda ke cermin (s′ = s). Tertukar kiri-kanan (tangan kananmu tampak sebagai tangan kiri bayangan).</div> <div class=\"fm\"><strong>Jumlah bayangan dua cermin: n = (360° ÷ θ) − 1</strong></div> <div class=\"co\"><strong>✏️ CONTOH SOAL</strong> Dua cermin datar diletakkan saling membentuk sudut <strong>60°</strong>. Berapa banyak bayangan yang terbentuk dari sebuah benda di antaranya?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; n = (360° ÷ θ) − 1 = (360° ÷ 60°) − 1&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; n = 6 − 1 = <strong>5 bayangan</strong> (kaleidoskop memakai prinsip ini)</div> <div class=\"co w\"><strong>🤔 TAHUKAH KAMU?</strong> Agar bisa melihat seluruh tubuh di cermin datar, tinggi cermin cukup <strong>setengah tinggi badan</strong>, berapa pun jarak berdirimu dari cermin.</div>"}, {"c": 3, "t": "3.3 Cermin Lengkung: Cekung dan Cembung", "i": "Bab 3 · Cahaya", "b": "<p>Cermin lengkung adalah cermin yang permukaannya melengkung seperti bagian bola. Hukum pemantulan tetap berlaku di setiap titiknya.</p> <div class=\"tw\"><table><thead><tr><th><strong>Istilah</strong></th><th><strong>Arti</strong></th></tr></thead><tbody><tr><td><strong>Titik pusat kelengkungan (M)</strong></td><td>pusat bola tempat cermin merupakan bagiannya</td></tr><tr><td><strong>Jari-jari kelengkungan (R)</strong></td><td>jarak M ke cermin; <strong>R = 2f</strong></td></tr><tr><td><strong>Titik fokus (F)</strong></td><td>titik tempat sinar sejajar sumbu utama berkumpul (cekung) atau seolah berasal (cembung); berada di tengah antara cermin dan M</td></tr><tr><td><strong>Jarak fokus (f)</strong></td><td>jarak F ke cermin; <strong>f = R ÷ 2</strong></td></tr><tr><td><strong>Sumbu utama</strong></td><td>garis lurus melalui M, F, dan titik tengah cermin (O)</td></tr></tbody></table></div> <h3>Tiga sinar istimewa pada cermin cekung</h3> <div class=\"tw\"><table><thead><tr><th><strong>1</strong></th><th>Sinar <strong>sejajar sumbu utama</strong> dipantulkan <strong>melalui titik fokus F</strong>.</th></tr></thead><tbody><tr><td><strong>2</strong></td><td>Sinar <strong>melalui titik fokus F</strong> dipantulkan <strong>sejajar sumbu utama</strong>.</td></tr><tr><td><strong>3</strong></td><td>Sinar <strong>melalui titik pusat kelengkungan M</strong> dipantulkan <strong>kembali melalui M</strong> (menyusuri jalur yang sama).</td></tr></tbody></table></div> <h3>Sifat bayangan pada cermin cekung</h3> <div class=\"tw\"><table><thead><tr><th><strong>Letak benda</strong></th><th><strong>Letak bayangan</strong></th><th><strong>Sifat bayangan</strong></th></tr></thead><tbody><tr><td><strong>Ruang I (antara O dan F)</strong></td><td>Ruang IV (di belakang cermin)</td><td>maya, tegak, diperbesar</td></tr><tr><td><strong>Tepat di F</strong></td><td>tak terhingga</td><td>tidak terbentuk bayangan jelas (sinar pantul sejajar)</td></tr><tr><td><strong>Ruang II (antara F dan M)</strong></td><td>Ruang III</td><td>nyata, terbalik, diperbesar</td></tr><tr><td><strong>Tepat di M</strong></td><td>tepat di M</td><td>nyata, terbalik, sama besar</td></tr><tr><td><strong>Ruang III (di luar M)</strong></td><td>Ruang II</td><td>nyata, terbalik, diperkecil</td></tr></tbody></table></div> <div class=\"co g\"><strong>🎯 TRIK INGAT</strong> <strong>Ruang benda + ruang bayangan = 5</strong> (untuk bayangan nyata). Contoh: benda di ruang III → bayangan di ruang II; benda di ruang II → bayangan di ruang III. Benda <strong>di dalam F</strong> (ruang I) selalu menghasilkan bayangan <strong>maya, tegak, diperbesar</strong>, itulah prinsip cermin rias.</div> <h3>Cermin cembung</h3> <p>Pada cermin cembung, bayangan <strong>selalu maya, tegak, dan diperkecil</strong>, dan terletak di belakang cermin, berapa pun letak bendanya. Sinar sejajar sumbu utama dipantulkan <strong>menyebar</strong> seolah-olah berasal dari titik fokus di belakang cermin.</p> <div class=\"tw\"><table><thead><tr><th><strong>Cermin</strong></th><th><strong>Sifat sinar</strong></th><th><strong>Dipakai pada</strong></th></tr></thead><tbody><tr><td><strong>Cekung</strong></td><td>mengumpulkan sinar (konvergen)</td><td>reflektor senter dan lampu mobil, cermin rias, cermin dokter gigi, antena parabola</td></tr><tr><td><strong>Cembung</strong></td><td>menyebarkan sinar (divergen); medan pandang luas</td><td>kaca spion, cermin tikungan jalan, cermin pengawas di toko</td></tr></tbody></table></div> <h3>Rumus cermin lengkung</h3> <div class=\"fm\"><strong>1 ÷ f = 1 ÷ s + 1 ÷ s′        M = │s′ ÷ s│ = h′ ÷ h</strong></div> <div class=\"tw\"><table><thead><tr><th><strong>Simbol</strong></th><th><strong>Arti</strong></th><th><strong>Aturan tanda</strong></th></tr></thead><tbody><tr><td><strong>f</strong></td><td>jarak fokus</td><td>cekung <strong>positif (+)</strong>, cembung <strong>negatif (−)</strong></td></tr><tr><td><strong>s</strong></td><td>jarak benda ke cermin</td><td>selalu positif</td></tr><tr><td><strong>s′</strong></td><td>jarak bayangan ke cermin</td><td><strong>positif</strong> = nyata (depan cermin), <strong>negatif</strong> = maya (belakang cermin)</td></tr><tr><td><strong>M</strong></td><td>perbesaran bayangan</td><td>M &gt; 1 diperbesar, M &lt; 1 diperkecil</td></tr><tr><td><strong>h, h′</strong></td><td>tinggi benda, tinggi bayangan</td><td>M = h′ ÷ h</td></tr></tbody></table></div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Cermin cekung</strong> Benda berada <strong>30 cm</strong> di depan cermin cekung berjarak fokus <strong>10 cm</strong>. Tentukan letak, perbesaran, dan sifat bayangan!&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; Diketahui: s = 30 cm, f = +10 cm.&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; 1 ÷ s′ = 1 ÷ f − 1 ÷ s = 1/10 − 1/30 = 3/30 − 1/30 = 2/30 → s′ = <strong>15 cm</strong> (positif → nyata)&lt;br&gt;&lt;strong&gt;3.&lt;/strong&gt; Perbesaran: M = s′ ÷ s = 15 ÷ 30 = <strong>0,5 kali</strong> (diperkecil)&lt;br&gt;&lt;strong&gt;4.&lt;/strong&gt; Benda di ruang III (di luar M = 20 cm) → bayangan nyata, terbalik, diperkecil, di ruang II ✔</div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Cermin cembung</strong> Benda berada <strong>60 cm</strong> di depan cermin cembung dengan jarak fokus <strong>20 cm</strong>. Di mana bayangannya?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; Cermin cembung: f = −20 cm, s = 60 cm.&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; 1 ÷ s′ = 1 ÷ f − 1 ÷ s = −1/20 − 1/60 = −3/60 − 1/60 = −4/60 → s′ = <strong>−15 cm</strong>&lt;br&gt;&lt;strong&gt;3.&lt;/strong&gt; Tanda negatif → bayangan <strong>maya</strong>, 15 cm di belakang cermin. M = 15 ÷ 60 = <strong>0,25 kali</strong> (diperkecil, tegak)</div>"}, {"c": 3, "t": "3.4 Pembiasan Cahaya", "i": "Bab 3 · Cahaya", "b": "<p><strong>Pembiasan</strong> adalah pembelokan arah rambat cahaya ketika melewati batas dua medium yang berbeda kerapatan optiknya. Penyebabnya, <strong>cepat rambat cahaya berubah</strong> di medium yang baru.</p> <div class=\"co\"><strong>📜 ATURAN PEMBIASAN</strong> Dari medium <strong>kurang rapat</strong> ke <strong>lebih rapat</strong> (udara → air/kaca): sinar dibiaskan <strong>mendekati garis normal</strong> (r &lt; i). Dari medium <strong>lebih rapat</strong> ke <strong>kurang rapat</strong> (air/kaca → udara): sinar dibiaskan <strong>menjauhi garis normal</strong> (r &gt; i). Jika sinar datang <strong>tegak lurus</strong> batas medium (i = 0°), sinar <strong>tidak dibelokkan</strong>.</div> <div class=\"tw\"><table><thead><tr><th><strong>Medium</strong></th><th><strong>Indeks bias (n)</strong></th><th><strong>Keterangan</strong></th></tr></thead><tbody><tr><td><strong>Udara / ruang hampa</strong></td><td>≈ 1</td><td>cahaya paling cepat</td></tr><tr><td><strong>Air</strong></td><td>1,33</td><td>cahaya lebih lambat</td></tr><tr><td><strong>Kaca</strong></td><td>≈ 1,5</td><td>cahaya makin lambat, pembelokan makin besar</td></tr><tr><td><strong>Berlian</strong></td><td>2,42</td><td>indeks bias sangat besar, itu yang membuatnya berkilau</td></tr></tbody></table></div> <div class=\"fm\"><strong>n = c ÷ v        n₁ sin i = n₂ sin r</strong></div> <p><strong>Pengayaan:</strong> c = 3 × 10⁸ m/s (cepat rambat cahaya di ruang hampa), v = cepat rambat cahaya di medium itu. Hukum kedua adalah <strong>hukum Snellius</strong>.</p> <div class=\"co\"><strong>✏️ CONTOH SOAL — Hukum Snellius</strong> Cahaya dari udara (n = 1) menuju air (n = 1,33) dengan sudut datang <strong>30°</strong>. Berapa sudut biasnya?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; 1 × sin 30° = 1,33 × sin r → 0,5 = 1,33 × sin r&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; sin r = 0,5 ÷ 1,33 ≈ 0,376 → r ≈ <strong>22°</strong>&lt;br&gt;&lt;strong&gt;3.&lt;/strong&gt; r &lt; i, jadi sinar mendekati garis normal ✔</div> <h3>Pembiasan di sekitar kita</h3> <div class=\"tw\"><table><thead><tr><th><strong>Peristiwa</strong></th><th><strong>Penjelasan</strong></th></tr></thead><tbody><tr><td><strong>Sedotan tampak patah di gelas berisi air</strong></td><td>cahaya dari bagian sedotan di air dibiaskan menjauhi normal saat keluar ke udara</td></tr><tr><td><strong>Dasar kolam tampak lebih dangkal</strong></td><td>sinar dari dasar dibiaskan sehingga bayangan tampak lebih tinggi</td></tr><tr><td><strong>Fatamorgana (jalan tampak basah di siang terik)</strong></td><td>cahaya dibiaskan berturut-turut oleh lapisan udara panas dan dingin</td></tr><tr><td><strong>Pelangi</strong></td><td>pembiasan, penguraian, dan pemantulan cahaya Matahari oleh tetes hujan</td></tr></tbody></table></div> <div class=\"co w\"><strong>🤔 TAHUKAH KAMU?</strong> <strong>Pemantulan sempurna</strong> terjadi jika cahaya dari medium rapat menuju medium kurang rapat dengan sudut datang <strong>lebih besar dari sudut kritis</strong> (air ≈ 49°, kaca ≈ 42°). Cahaya dipantulkan seluruhnya. Prinsip ini dipakai pada <strong>serat optik</strong> untuk internet berkecepatan tinggi, serta prisma pada periskop dan teropong.</div>"}, {"c": 3, "t": "3.5 Dispersi dan Warna", "i": "Bab 3 · Cahaya", "b": "<p><strong>Dispersi</strong> adalah penguraian cahaya putih menjadi cahaya berwarna-warni karena tiap warna dibiaskan dengan besar sudut yang berbeda. Urutannya: <strong>me</strong>rah, <strong>ji</strong>ngga, <strong>ku</strong>ning, <strong>hi</strong>jau, <strong>bi</strong>ru, <strong>ni</strong>la, <strong>u</strong>ngu (mejikuhibiniu). <strong>Merah dibelokkan paling kecil, ungu paling besar.</strong></p> <div class=\"tw\"><table><thead><tr><th><strong>Hal</strong></th><th><strong>Penjelasan</strong></th></tr></thead><tbody><tr><td><strong>Warna benda</strong></td><td>benda tampak berwarna karena <strong>memantulkan</strong> warna itu dan <strong>menyerap</strong> warna lain</td></tr><tr><td><strong>Benda putih</strong></td><td>memantulkan semua warna</td></tr><tr><td><strong>Benda hitam</strong></td><td>menyerap hampir semua warna</td></tr><tr><td><strong>Apel merah</strong></td><td>memantulkan cahaya merah, menyerap warna lainnya</td></tr><tr><td><strong>Warna primer cahaya</strong></td><td>merah, hijau, biru; jika dicampur semuanya, hasilnya cahaya <strong>putih</strong></td></tr><tr><td><strong>Warna sekunder cahaya</strong></td><td>merah + hijau = kuning; hijau + biru = sian (cyan); merah + biru = magenta</td></tr></tbody></table></div> <h3>Keluarga gelombang elektromagnetik</h3> <p>Cahaya hanyalah sebagian kecil dari keluarga gelombang elektromagnetik. Dari kiri ke kanan: frekuensi dan energi <strong>makin besar</strong>, panjang gelombang <strong>makin pendek</strong>, sedangkan cepat rambatnya di ruang hampa <strong>sama</strong>.</p> <div class=\"tw\"><table><thead><tr><th><strong>Gelombang</strong></th><th><strong>Pemanfaatan</strong></th></tr></thead><tbody><tr><td><strong>Gelombang radio</strong></td><td>siaran radio dan televisi, komunikasi</td></tr><tr><td><strong>Gelombang mikro</strong></td><td>oven microwave, radar, sinyal telepon genggam</td></tr><tr><td><strong>Inframerah</strong></td><td>remote TV, kamera malam, sensor panas</td></tr><tr><td><strong>Cahaya tampak</strong></td><td>penglihatan, fotosintesis</td></tr><tr><td><strong>Ultraviolet</strong></td><td>sterilisasi alat, pembentukan vitamin D (berlebihan berbahaya bagi kulit)</td></tr><tr><td><strong>Sinar-X</strong></td><td>foto rontgen tulang</td></tr><tr><td><strong>Sinar gamma</strong></td><td>terapi kanker, sterilisasi alat medis</td></tr></tbody></table></div>"}, {"c": 3, "t": "3.6 Lensa", "i": "Bab 3 · Cahaya", "b": "<p><strong>Lensa</strong> adalah benda bening yang kedua permukaannya (atau salah satunya) melengkung. Cahaya yang melewatinya dibiaskan.</p> <div class=\"tw\"><table><thead><tr><th><strong>Jenis</strong></th><th><strong>Bentuk</strong></th><th><strong>Sifat sinar</strong></th><th><strong>Contoh pemakaian</strong></th></tr></thead><tbody><tr><td><strong>Lensa cembung (positif)</strong></td><td>tebal di tengah</td><td>mengumpulkan sinar (konvergen)</td><td>lup, kamera, mikroskop, kacamata hipermetropi</td></tr><tr><td><strong>Lensa cekung (negatif)</strong></td><td>tipis di tengah</td><td>menyebarkan sinar (divergen)</td><td>kacamata miopi, lubang intip pintu</td></tr></tbody></table></div> <h3>Tiga sinar istimewa pada lensa cembung</h3> <div class=\"tw\"><table><thead><tr><th><strong>1</strong></th><th>Sinar <strong>sejajar sumbu utama</strong> dibiaskan <strong>melalui titik fokus F′</strong> di sisi seberang.</th></tr></thead><tbody><tr><td><strong>2</strong></td><td>Sinar <strong>melalui titik fokus F</strong> (sisi benda) dibiaskan <strong>sejajar sumbu utama</strong>.</td></tr><tr><td><strong>3</strong></td><td>Sinar <strong>melalui pusat optik O</strong> diteruskan <strong>lurus tanpa dibelokkan</strong>.</td></tr></tbody></table></div> <h3>Sifat bayangan pada lensa cembung</h3> <div class=\"tw\"><table><thead><tr><th><strong>Letak benda</strong></th><th><strong>Letak bayangan</strong></th><th><strong>Sifat bayangan</strong></th><th><strong>Contoh alat</strong></th></tr></thead><tbody><tr><td><strong>Ruang I (antara O dan F)</strong></td><td>sisi yang sama dengan benda</td><td>maya, tegak, diperbesar</td><td>lup</td></tr><tr><td><strong>Tepat di F</strong></td><td>tak terhingga</td><td>tidak terbentuk bayangan jelas</td><td>—</td></tr><tr><td><strong>Ruang II (antara F dan 2F)</strong></td><td>Ruang III (seberang lensa)</td><td>nyata, terbalik, diperbesar</td><td>proyektor, lensa objektif mikroskop</td></tr><tr><td><strong>Tepat di 2F</strong></td><td>tepat di 2F′</td><td>nyata, terbalik, sama besar</td><td>—</td></tr><tr><td><strong>Ruang III (di luar 2F)</strong></td><td>Ruang II (seberang lensa)</td><td>nyata, terbalik, diperkecil</td><td>kamera, mata</td></tr></tbody></table></div> <div class=\"co g\"><strong>🎯 TRIK INGAT</strong> Sama seperti cermin: <strong>ruang benda + ruang bayangan = 5</strong> untuk bayangan nyata. <strong>Lensa cekung</strong> selalu menghasilkan bayangan <strong>maya, tegak, diperkecil</strong>, dan terletak di depan lensa.</div> <h3>Rumus lensa dan daya lensa</h3> <div class=\"fm\"><strong>1 ÷ f = 1 ÷ s + 1 ÷ s′        P = 1 ÷ f (m) = 100 ÷ f (cm)</strong></div> <p>Aturan tanda sama seperti cermin, hanya saja f lensa <strong>cembung positif</strong> dan f lensa <strong>cekung negatif</strong>. Daya lensa <strong>P</strong> diukur dalam <strong>dioptri (D)</strong>; lensa dengan f = 1 m berdaya 1 D.</p> <div class=\"co\"><strong>✏️ CONTOH SOAL — Lensa cembung</strong> Benda berada <strong>15 cm</strong> di depan lensa cembung berfokus <strong>10 cm</strong>. Tentukan letak, perbesaran, dan sifat bayangannya!&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; 1 ÷ s′ = 1 ÷ f − 1 ÷ s = 1/10 − 1/15 = 3/30 − 2/30 = 1/30 → s′ = <strong>30 cm</strong> (nyata)&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; Perbesaran: M = s′ ÷ s = 30 ÷ 15 = <strong>2 kali</strong> (diperbesar)&lt;br&gt;&lt;strong&gt;3.&lt;/strong&gt; Benda di ruang II (10–20 cm) → bayangan nyata, terbalik, diperbesar, di ruang III ✔</div> <div class=\"co\"><strong>✏️ CONTOH SOAL — Kaca pembesar</strong> Sebuah benda diletakkan <strong>5 cm</strong> di depan lensa cembung berfokus <strong>10 cm</strong>. Bagaimana bayangannya?&lt;br&gt;&lt;strong&gt;1.&lt;/strong&gt; 1 ÷ s′ = 1/10 − 1/5 = 1/10 − 2/10 = −1/10 → s′ = <strong>−10 cm</strong>&lt;br&gt;&lt;strong&gt;2.&lt;/strong&gt; Tanda negatif → bayangan <strong>maya</strong> (di depan lensa). M = 10 ÷ 5 = <strong>2 kali</strong>, tegak, diperbesar → inilah cara kerja lup</div> <div class=\"co w\"><strong>🔬 COBA DI RUMAH</strong> <strong>Sendok sebagai cermin:</strong> lihat wajahmu di bagian dalam sendok (cermin cekung) dan bagian luarnya (cermin cembung). Mana yang terbalik, mana yang tegak? <strong>Sedotan di gelas:</strong> lihat dari samping, mengapa tampak patah? <strong>Pelangi mini:</strong> arahkan senter ke permukaan CD atau semprotkan air ke arah Matahari. <strong>Tetes air sebagai lup:</strong> teteskan air ke plastik bening di atas tulisan kecil.</div>"}, {"c": 3, "t": "Coba sendiri · Soal 1", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Cahaya datang pada cermin datar dengan sudut datang 35°. Berapa sudut pantulnya, dan berapa sudut antara sinar datang dan sinar pantul?", "a": "Sudut pantul = <strong>35°</strong>; sudut antara kedua sinar = 35° + 35° = <strong>70°</strong>"}, {"c": 3, "t": "Coba sendiri · Soal 2", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Dua cermin datar membentuk sudut 45°. Berapa jumlah bayangan?", "a": "n = 360° ÷ 45° − 1 = 8 − 1 = <strong>7 bayangan</strong>"}, {"c": 3, "t": "Coba sendiri · Soal 3", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Benda 5 cm di depan cermin cekung berfokus 10 cm. Bagaimana sifat bayangannya?", "a": "1 ÷ s′ = 1/10 − 1/5 = −1/10 → s′ = −10 cm → <strong>maya, tegak, diperbesar 2 kali</strong> (benda di ruang I)"}, {"c": 3, "t": "Coba sendiri · Soal 4", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Cahaya dari air menuju udara. Dibiaskan mendekati atau menjauhi garis normal?", "a": "<strong>Menjauhi</strong> garis normal, karena dari medium lebih rapat ke kurang rapat."}, {"c": 3, "t": "Coba sendiri · Soal 5", "i": "Kerjakan dulu tanpa mengintip jawaban.", "b": "", "q": "Sebuah lensa berfokus 25 cm. Berapa daya lensanya?", "a": "P = 100 ÷ 25 = <strong>+4 dioptri</strong> (lensa cembung)"}, {"c": 4, "t": "4.1 Mata: Alat Optik Alami", "i": "Bab 4 · Alat Optik", "b": "<p>Mata bekerja seperti kamera. Cahaya dari benda masuk, difokuskan oleh lensa mata, lalu membentuk bayangan <strong>nyata, terbalik, dan diperkecil</strong> di retina. Otak kemudian menafsirkannya sebagai gambar yang tegak.</p> <div class=\"tw\"><table><thead><tr><th><strong>Cahaya</strong> <strong>masuk lewat kornea</strong></th><th><strong>➜</strong></th><th><strong>Pupil</strong> <strong>diatur oleh iris</strong></th><th><strong>➜</strong></th><th><strong>Lensa mata</strong> <strong>memfokuskan cahaya</strong></th><th><strong>➜</strong></th><th><strong>Retina</strong> <strong>bayangan nyata, terbalik</strong></th><th><strong>➜</strong></th><th><strong>Saraf optik</strong> <strong>ke otak</strong></th></tr></thead><tbody></tbody></table></div> <div class=\"tw\"><table><thead><tr><th><strong>Bagian mata</strong></th><th><strong>Fungsi</strong></th></tr></thead><tbody><tr><td><strong>Kornea</strong></td><td>selaput bening di depan; melindungi dan ikut membiaskan cahaya</td></tr><tr><td><strong>Iris</strong></td><td>selaput berwarna yang mengatur lebar pupil</td></tr><tr><td><strong>Pupil</strong></td><td>celah tempat cahaya masuk; <strong>mengecil</strong> di tempat terang, <strong>melebar</strong> di tempat gelap</td></tr><tr><td><strong>Lensa mata</strong></td><td>lensa cembung yang memfokuskan cahaya ke retina; kecembungannya dapat berubah</td></tr><tr><td><strong>Otot siliaris</strong></td><td>mengubah tebal-tipis lensa mata (akomodasi)</td></tr><tr><td><strong>Retina</strong></td
